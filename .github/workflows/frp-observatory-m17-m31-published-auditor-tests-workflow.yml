          python -m unittest discover \
            -s tests \
            -p 'test_m31_published_auditor.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m17-dedicated-tests.txt"

          grep -F "Ran 29 tests" \
            "$RUNNER_TEMP/frp-observatory-m17-dedicated-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m17-dedicated-tests.txt"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m17-full-tests.txt"

          grep -F "Ran 543 tests" \
            "$RUNNER_TEMP/frp-observatory-m17-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m17-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? tests/test_m31_published_auditor.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-auditor-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 Artifact Auditor tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SOURCE_SHA256: fa0e87af9509c6a9cb76083982eee791008d869520ffb29656a302a9a85e7b85
        run: |
          set -euo pipefail
          target="tests/test_m31_published_auditor.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("tests/test_m31_published_auditor.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 auditor tests are missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit(f"M31 auditor test digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 auditor tests are already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Artifact Auditor tests"
          git push origin HEAD:main

      - name: Publish M17 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M17"
            echo
            echo "- Exact M31 Artifact Auditor tests: 29"
            echo "- Complete Observatory tests: 543"
            echo "- Exact M31 published documents: 4"
            echo "- Artifact Auditor reports: 4"
            echo "- Deterministic validation checks: 47"
            echo "- Failed validation checks: 0"
            echo "- Exact enum routing: required"
            echo "- Strict JSON replay: required"
            echo "- Source execution: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Thermal contour merging: forbidden"
            echo "- Semantic reimplementation: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory auditor test files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
