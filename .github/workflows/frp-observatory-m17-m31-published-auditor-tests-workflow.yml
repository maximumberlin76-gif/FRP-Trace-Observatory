        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit("Auditor test payload length mismatch")
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit("Auditor test payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit("Compressed auditor test length mismatch")
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit("Compressed auditor test digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_SOURCE_LENGTH"]):
              raise SystemExit("Decoded auditor test length mismatch")
          if source.count(b"\n") != int(os.environ["TEST_SOURCE_LINES"]):
              raise SystemExit("Decoded auditor test line-count mismatch")
          if observed_source_sha256 != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit("Decoded auditor test digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded auditor test newline mismatch")

          parent = Path("tests")
          target = parent / "test_m31_published_auditor.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("tests package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 auditor test target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical M31 auditor tests"
                  )
              print("Exact M31 auditor tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 auditor tests")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 auditor test verification failed")
          print(f"auditor_test_bytes={len(source)}")
          print(f"auditor_test_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 Artifact Auditor tests and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
