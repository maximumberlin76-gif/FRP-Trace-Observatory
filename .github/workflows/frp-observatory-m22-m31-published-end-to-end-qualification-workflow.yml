          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit("M31 end-to-end payload length mismatch")
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit("M31 end-to-end payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit("Compressed M31 end-to-end payload mismatch")
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit("Compressed M31 end-to-end digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_LENGTH"]):
              raise SystemExit("Decoded M31 end-to-end length mismatch")
          if source.count(b"\n") != int(os.environ["TEST_LINES"]):
              raise SystemExit("Decoded M31 end-to-end line-count mismatch")
          if observed_source_sha256 != os.environ["TEST_SHA256"]:
              raise SystemExit("Decoded M31 end-to-end digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded M31 end-to-end newline mismatch")

          target = Path(
              "tests/test_m31_published_observatory_end_to_end.py"
          )
          if target.parent.is_symlink() or not target.parent.is_dir():
              raise SystemExit("Observatory tests boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 end-to-end target is a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical end-to-end tests"
                  )
              print("Exact M31 end-to-end tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 end-to-end tests")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 end-to-end verification failed")
          print(f"end_to_end_test_bytes={len(source)}")
          print(f"end_to_end_test_sha256={observed_source_sha256}")
          PY

      - name: Qualify the complete exact M31 Observatory route
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m22-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m unittest \
            tests.test_m31_published_observatory_end_to_end \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m22-targeted-tests.txt"

          grep -F "Ran 26 tests" \
            "$RUNNER_TEMP/frp-observatory-m22-targeted-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m22-targeted-tests.txt"

          python -m artifact_auditor.m31_published_auditor \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m22-auditor.txt"
          auditor="$RUNNER_TEMP/frp-observatory-m22-auditor.txt"
          grep -Fx \
            "FRP Observatory M31 published Artifact Auditor: PASS" \
            "$auditor"
          grep -Fx "audit_reports=4" "$auditor"
          grep -Fx "validation_checks=47" "$auditor"
          grep -Fx "failed_checks=0" "$auditor"
          grep -Fx \
            "batch_sha256=3e5eb2ad76f2605a49cc8a53902435bdcc1b52afac40dcdb3132fd33ce94d591" \
            "$auditor"

          python -m trace_explorer.m31_published_trace_explorer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m22-trace.txt"
          trace="$RUNNER_TEMP/frp-observatory-m22-trace.txt"
          grep -Fx \
            "FRP Observatory M31 published Trace Explorer: PASS" \
            "$trace"
          grep -Fx "trace_contours=2" "$trace"
          grep -Fx "records=100" "$trace"
          grep -Fx "cell_snapshots=800" "$trace"
          grep -Fx "active_zero_after_observations=702" "$trace"
          grep -Fx "observed_ternary_domain=-1/0/1" "$trace"
          grep -Fx \
            "dataset_sha256=ef5a040c9d30d02f90003e007e447cf0d66238f31ed27e3be92bdce31ad19fff" \
            "$trace"

          python -m transition_visualizer.m31_published_transition_visualizer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m22-visualizer.txt"
          visualizer="$RUNNER_TEMP/frp-observatory-m22-visualizer.txt"
          grep -Fx \
            "FRP Observatory M31 published Transition Visualizer: PASS" \
            "$visualizer"
          grep -Fx "transition_frames=800" "$visualizer"
          grep -Fx "balanced_ternary_notation=-1/0/1" "$visualizer"
          grep -Fx "active_neutral_state=0" "$visualizer"
          grep -Fx "thermal_contours=4" "$visualizer"
          grep -Fx "physical_temperature_measurements=0" "$visualizer"
          grep -Fx \
            "dataset_sha256=0ad87af2486798918a86a8a9fababdb45cb2b633c0f66e7c9b80b590ca8ed304" \
            "$visualizer"

          for result in "$auditor" "$trace" "$visualizer"; do
            grep -Fx "source_execution=forbidden" "$result"
            grep -Fx "metric_normalization=forbidden" "$result"
            grep -Fx "thermal_contour_merging=forbidden" "$result"
            grep -Fx "semantic_reimplementation=forbidden" "$result"
            grep -Fx "source_mutation=forbidden" "$result"
            grep -Fx "downstream_writeback=forbidden" "$result"
          done

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m22-full-tests.txt"

          grep -F "Ran 655 tests" \
            "$RUNNER_TEMP/frp-observatory-m22-full-tests.txt"
          grep -E '^OK( \(skipped=[0-9]+\))?$' \
            "$RUNNER_TEMP/frp-observatory-m22-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? tests/"
              "test_m31_published_observatory_end_to_end.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 end-to-end tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SHA256: 0c5cb2f2cfd9b2c8659cfb3645f70efb727d99ed371886b48ca4f21a5bffce2f
        run: |
          set -euo pipefail
          target="tests/test_m31_published_observatory_end_to_end.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(
              "tests/test_m31_published_observatory_end_to_end.py"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 end-to-end tests are missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SHA256"]:
              raise SystemExit(
                  f"M31 end-to-end test digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 end-to-end tests are already published."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Observatory end-to-end qualification"
          git push origin HEAD:main

