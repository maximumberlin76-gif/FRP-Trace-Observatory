name: FRP Observatory M22 M31 Published End-to-End Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m22-m31-published-end-to-end-qualification-main
  cancel-in-progress: false

jobs:
  publish-m31-end-to-end-qualification:
    name: Install and qualify the complete exact M31 Observatory route
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M21 three-mode boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/artifact_auditor/"
                  "m31_published_boundary_intake.py"
              ): (
                  32_266,
                  "f3cfcbc5c388065f8544b16c07bb988d"
                  "269ec3745d141de215ff48b0e72e277c",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_boundary_intake.py"
              ): (
                  22_234,
                  "6366338358552d27b038a0ff3f08b12e"
                  "8bb376f1b09afa7dd0e59fc0706cf1d7",
              ),
              Path(
                  "observatory/schemas/"
                  "m31_published_registry.py"
              ): (
                  22_102,
                  "746a71a1fe2aaa1c367d1d6f6e2f65b0"
                  "c32908ed89626b4d2335fe866f572e3e",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_registry.py"
              ): (
                  24_161,
                  "cd8e89b4682a794dd6543ba779f5758e7"
                  "6e4b344cbbc7c61341bd6caa2694970",
              ),
              Path(
                  "observatory/parsers/"
                  "m31_published_dispatch.py"
              ): (
                  16_928,
                  "7140a132f929076f22d2c4868b6a068e"
                  "a21c5593b9672bc45df6cb1e2b81c495",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_dispatch.py"
              ): (
                  23_063,
                  "cf1689a9a930f6bd9a202f85318b5e5c"
                  "cb8df3b262fb314b9de063e80769d3bb",
              ),
              Path(
                  "observatory/artifact_auditor/"
                  "m31_published_auditor.py"
              ): (
                  53_409,
                  "efbcb971b946706e4102d4db37fb6fd2"
                  "384ba2b63fefeadd1dc61cd78460dc66",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_auditor.py"
              ): (
                  27_245,
                  "fa0e87af9509c6a9cb76083982eee791"
                  "008d869520ffb29656a302a9a85e7b85",
              ),
              Path(
                  "observatory/trace_explorer/"
                  "m31_published_trace_explorer.py"
              ): (
                  79_396,
                  "b0dac82ece92a0886c7ab968d3eed4e9"
                  "df1ae76eb3d84bfe05bf19cb69ef2893",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_trace_explorer.py"
              ): (
                  29_180,
                  "a176d49f4ccd10188fb096ab6e528316"
                  "e0d98c956382a84fa2accbc869dd8cb5",
              ),
              Path(
                  "observatory/transition_visualizer/"
                  "m31_published_transition_visualizer.py"
              ): (
                  70_767,
                  "33de1cc15240dda0fc75cdb1feb8efa4"
                  "3e0d4e08026d98e8521939ae7162a96c",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_transition_visualizer.py"
              ): (
                  30_076,
                  "f624116452dc765031ad06de9513046c9"
                  "9492c5689afe31d4b2954d87486969f",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/tests/"
              "test_m31_published_observatory_end_to_end.py"
          )
          expected_target_sha256 = (
              "0c5cb2f2cfd9b2c8659cfb3645f70efb"
              "727d99ed371886b48ca4f21a5bffce2f"
          )
          if target.is_symlink():
              raise SystemExit("M31 end-to-end test target is a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit(
                      "M31 end-to-end test target is not a regular file"
                  )
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "Unexpected M31 end-to-end tests already exist: "
                      f"{observed}"
                  )
              print("Exact M31 end-to-end tests are already present")
          else:
              print("M31 end-to-end test target is ready")

          print("Exact M21 three-mode prerequisite: PASS")
          PY

