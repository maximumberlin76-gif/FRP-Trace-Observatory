          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          target = Path("trace_explorer/m30_published_trace_explorer.py")
          encoded = "".join(os.environ["MODULE_GZIP_BASE64"].split())
          compressed = base64.b64decode(encoded, validate=True)
          source = gzip.decompress(compressed)
          expected = os.environ["MODULE_SHA256"]
          observed = hashlib.sha256(source).hexdigest()

          if observed != expected:
              raise SystemExit(
                  f"Decoded module digest mismatch: {observed} != {expected}"
              )

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source)

          written = hashlib.sha256(target.read_bytes()).hexdigest()
          if written != expected:
              raise SystemExit(
                  f"Written module digest mismatch: {written} != {expected}"
              )

          print(f"Installed complete source: {target}")
          print(f"source_sha256={expected}")
          PY

      - name: Validate the exact M16 Trace Explorer source boundary
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m trace_explorer.m30_published_trace_explorer \
            --archive "$archive"

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from artifact_auditor.audit_report import ValidationStatus
          from schemas.registry import ObservatoryMode
          from trace_explorer.m30_published_trace_explorer import (
              explore_m30_published_archive,
          )

          archive = (
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = explore_m30_published_archive(archive)

          if result.audit_batch.overall_status is not (
              ValidationStatus.RECOGNIZED_VALID
          ):
              raise SystemExit("M7A did not receive a green M6 audit batch")

          if result.audit_batch.batch_sha256 != (
              "aeb9c1d7390a3bc3d1d7ef35c5f3f110e195e9b7ac8d4a4f4636c47c0a99bd03"
          ):
              raise SystemExit("M6 audit batch identity changed")

          if (
              result.audit_batch.total_check_count,
              result.audit_batch.failed_check_count,
          ) != (69, 0):
              raise SystemExit("M6 audit evidence changed")

          if result.member_id != "m16-fpga-preparation-execution-trace":
              raise SystemExit("M7A selected the wrong published member")

          if result.dispatch.dispatch_sha256 != (
              "55e9c53f55cc5507e33271bfcdd2a48c751fd710b9fe8f9df972fc1c308f69b2"
          ):
              raise SystemExit("M5 Trace Explorer dispatch identity changed")

          expected_dispatch = (
              result.audit_batch.dispatch_batch.dispatch_for(
                  "m16-fpga-preparation-execution-trace",
                  ObservatoryMode.TRACE_EXPLORER,
              )
          )
          if result.dispatch is not expected_dispatch:
              raise SystemExit("M7A reconstructed the M5 dispatch route")

          if (
              result.record_count,
              result.cell_snapshot_count,
              result.request_count,
          ) != (4, 32, 8):
              raise SystemExit("M7A complete trace inventory changed")

          if result.source_record_digest != (
              "4b2e8aec64a0b3cb76d0819383ed66d306b8e50dc3feb7bb8c6c76486cd83d57"
          ):
              raise SystemExit("M16 source record digest changed")

          if result.dataset_sha256 != (
              "4e6e0a1cd13dccbf6c6ab45850aefcb09d212fe4883f2d56c2c190dbee42bafd"
          ):
              raise SystemExit("M7A deterministic dataset digest changed")

          if result.trace_dataset_id != (
              "4191b36e-9168-5fc7-a4b5-cbc3b480136f"
          ):
              raise SystemExit("M7A deterministic dataset identifier changed")

          if result.observed_ternary_domain != (-1, 0, 1):
              raise SystemExit("Ternary domain is not exactly -1/0/1")

          if result.observed_scheduler_modes != ("free", "1/7"):
              raise SystemExit("Source-observed scheduler modes changed")

          if "7/1" in result.observed_scheduler_modes:
              raise SystemExit("M7A synthesized an unobserved 7/1 record")

          global_core = result.audit_batch.report_for_member(
              "m28-trace-observatory-upstream-contract"
          ).dispatch.parsed_artifact.root["immutable_core"]

          if global_core["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("Immutable kernel notation changed")

          if global_core["semantic_values"] != (-1, 0, 1):
              raise SystemExit("Immutable ternary values changed")

          if global_core["active_neutral_state"] != 0:
              raise SystemExit("Immutable active neutral state changed")

          if global_core["temporal_scheduler_modes"] != ("1/7", "7/1"):
              raise SystemExit("Immutable scheduler order changed")

          direction = result.audit_batch.report_for_member(
              "m28-trace-observatory-upstream-contract"
          ).dispatch.parsed_artifact.root["integration_direction"]

          if direction["direction"] != "upstream_to_downstream_only":
              raise SystemExit("Observatory integration direction changed")

          if direction["downstream_source_mutation"] != "forbidden":
              raise SystemExit("Downstream source mutation became allowed")

          if direction["downstream_writeback"] != "forbidden":
              raise SystemExit("Downstream writeback became allowed")

          repeated = explore_m30_published_archive(archive)
          if repeated.dataset_sha256 != result.dataset_sha256:
              raise SystemExit("Repeated M7A projection digest changed")

          if repeated.trace_dataset_id != result.trace_dataset_id:
              raise SystemExit("Repeated M7A projection identifier changed")

          print("Exact M16 Trace Explorer source projection: PASS")
          print("Four records, 32 cell snapshots, eight requests: RETAINED")
          print("Balanced ternary kernel -1/0/1: RETAINED")
          print("Active neutral state 0: RETAINED")
          print("Global scheduler order 1/7 and 7/1: RETAINED")
          print("Observed free and 1/7 source records: RETAINED")
          print("Unobserved 7/1 record synthesis: FORBIDDEN")
          print("Upstream source mutation and writeback: FORBIDDEN")
          PY

          FRP_M30_ARCHIVE_PATH="$archive" \
            PYTHONPATH=. \
            python -m unittest discover -s tests -v \
            2>&1 | tee m7a-regression.log

          grep -F "Ran 377 tests" m7a-regression.log
          grep -Fx "OK" m7a-regression.log
          rm m7a-regression.log

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          expected = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )
          observed = sha256(archive.read_bytes()).hexdigest()

          if observed != expected:
              raise SystemExit("Upstream archive changed during M7A validation")

          print("Read-only upstream archive after M7A: VERIFIED")
          PY

      - name: Commit the complete M30 published Trace Explorer source
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          target="trace_explorer/m30_published_trace_explorer.py"

          git diff --check -- "$target"
          git add -- "$target"

          if git diff --cached --quiet; then
            echo "The exact M30 published Trace Explorer source is already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^trace_explorer/m30_published_trace_explorer.py$' ||
              true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Add M30 published Trace Explorer source" \
            -m "Create the deterministic read-only M16 Trace Explorer projection from exact M6 audit evidence while retaining source order, -1/0/1 states, active-neutral routing, observed scheduler records, source coordinates, separate measurement contours, and the upstream-only no-writeback boundary."

          git push origin HEAD:main
