name: FRP Observatory M7A Published Trace Explorer Source Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m7a-published-trace-explorer-source-main
  cancel-in-progress: false

jobs:
  bootstrap-published-trace-explorer-source:
    name: Bootstrap the exact M16 published Trace Explorer source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Require exact green M1 through M6 dependencies
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              "artifact_auditor/m30_archive_intake.py":
                  "d1101f5baf74fdcea4d08a14e7b21e1a6657ca19eb29d8387aba15f3ac5d904d",
              "artifact_auditor/m30_published_boundary_intake.py":
                  "4b1f580596425b15dd4548c30336db45a14b7aad4285feeb7cb490edc20b4b42",
              "schemas/m30_published_registry.py":
                  "d2769b3444a836e17e41a47fd34ca9c792d0897cb68e345ed4f622ff72ec8ab0",
              "tests/test_m30_published_registry.py":
                  "310f5e50a06d3e36603d49114741f6f87622d2b9f419773aabe1b2c9facadb99",
              "parsers/m30_published_member_intake.py":
                  "827af9233facfee466606163589c0b068d107b05e6bb8cbff4245409a09c367a",
              "tests/test_m30_published_member_intake.py":
                  "873bfa4c0d163b6a1b0df09873cdec6ecb39f12d496f49a76ec98bc5cda02c9e",
              "parsers/m30_published_dispatch.py":
                  "ba65c7cc1ad6d483dc1bbb09c729a165074280581f988f5a272c5e1289a33d50",
              "tests/test_m30_published_dispatch.py":
                  "a2ac6b0b5c6112756d0bec193b51e60926d07c45ce8ca6450110623db643ad64",
              "artifact_auditor/m30_published_auditor.py":
                  "3964ffaf2c0c51ba15a637ee3c18897de966d4b32e7931aabdd0d52c97c7de59",
              "tests/test_m30_published_auditor.py":
                  "18c3e4716337bba35000a4c44aab2f334d9cb4af98365517f712ddadaa26130a",
              "parsers/source_artifact.py":
                  "dad32b37e8a14213d91c9bfb407129ebb077432a8a366ad6ddb9a78bc9a0d59e",
              "parsers/json_artifact.py":
                  "3164a5704404f6ef7a16cfd6954ec14c9b1c1c757da3e7584eb500798e071efb",
              "schemas/registry.py":
                  "4d17a350bccd27edaafe1736a70ee153da426556355ce113416dbe6b596a43f2",
              "parsers/artifact_dispatch.py":
                  "abc765e34efd27a532b1fca0c91fc1982dbadd0a6d3d34b619e31225895cf050",
              "artifact_auditor/audit_report.py":
                  "94c665e47257c8ed3b2df03844791fd0bdc415aad3791a8eea155114492ddfc2",
          }

          for path_value, expected in requirements.items():
              target = Path(path_value)
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Required exact source is missing: {target}")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Source mismatch for {target}: {observed} != {expected}"
                  )
              print(f"Exact dependency: {target}: PASS")
          PY

      - name: Verify the exact upstream M30 package identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          expected_length = 10_189_989
          expected_digest = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )

          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Exact FRP M30 archival package is missing")

          raw = archive.read_bytes()
          observed_digest = sha256(raw).hexdigest()

          if len(raw) != expected_length:
              raise SystemExit(
                  f"M30 package length mismatch: {len(raw)} != {expected_length}"
              )
          if observed_digest != expected_digest:
              raise SystemExit(
                  f"M30 package digest mismatch: "
                  f"{observed_digest} != {expected_digest}"
              )

          print("Exact FRP v3.2.0 / M30 package identity: PASS")
          PY

