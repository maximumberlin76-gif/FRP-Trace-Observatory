name: FRP Observatory M12 M31 Published Registry Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m12-m31-published-registry-source-main
  cancel-in-progress: false

jobs:
  publish-m31-registry-source:
    name: Install and qualify exact M31 registry source
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M11 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/.github/workflows/"
                  "frp-observatory-m11-m31-published-boundary-"
                  "tests-workflow.yml"
              ): (
                  19_818,
                  "4dd0c8a3f7a8372e5efa4d8bfa6dd644"
                  "a80535541679cc3bfd0d6ca1501fc75c",
              ),
              Path(
                  "observatory/artifact_auditor/"
                  "m31_published_boundary_intake.py"
              ): (
                  32_266,
                  "f3cfcbc5c388065f8544b16c07bb988d"
                  "269ec3745d141de215ff48b0e72e277c",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_boundary_intake.py"
              ): (
                  22_234,
                  "6366338358552d27b038a0ff3f08b12e"
                  "8bb376f1b09afa7dd0e59fc0706cf1d7",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/schemas/m31_published_registry.py"
          )
          expected_target_sha256 = (
              "746a71a1fe2aaa1c367d1d6f6e2f65b0"
              "c32908ed89626b4d2335fe866f572e3e"
          )
          if target.is_symlink():
              raise SystemExit("M31 registry target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit("M31 registry target is not a regular file")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "An unexpected M31 registry already exists: "
                      f"{observed}"
                  )
              print("Exact M31 registry source is already present")
          else:
              print("M31 registry target is ready")

          print("Exact M11 workflow prerequisite: PASS")
          print("Exact M31 boundary source and tests: PASS")
          PY

