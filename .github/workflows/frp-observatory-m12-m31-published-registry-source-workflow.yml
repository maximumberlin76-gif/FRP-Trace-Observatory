          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["REGISTRY_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["REGISTRY_BASE64_LENGTH"]):
              raise SystemExit("Registry payload length mismatch")
          if (
              observed_encoded_sha256
              != os.environ["REGISTRY_BASE64_SHA256"]
          ):
              raise SystemExit("Registry payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["REGISTRY_GZIP_LENGTH"]):
              raise SystemExit("Compressed registry length mismatch")
          if (
              observed_compressed_sha256
              != os.environ["REGISTRY_GZIP_SHA256"]
          ):
              raise SystemExit("Compressed registry digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["REGISTRY_SOURCE_LENGTH"]):
              raise SystemExit("Decoded registry length mismatch")
          if source.count(b"\n") != int(
              os.environ["REGISTRY_SOURCE_LINES"]
          ):
              raise SystemExit("Decoded registry line-count mismatch")
          if (
              observed_source_sha256
              != os.environ["REGISTRY_SOURCE_SHA256"]
          ):
              raise SystemExit("Decoded registry digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded registry terminal newline mismatch")

          parent = Path("schemas")
          target = parent / "m31_published_registry.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("schemas package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 registry target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 registry"
                  )
              print("Exact M31 registry source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 registry source")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 registry verification failed")
          print(f"registry_bytes={len(source)}")
          print(f"registry_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 registry and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m12-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m schemas.m31_published_registry \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m12-registry.txt"

          grep -Fx \
            "FRP Observatory M31 published document registry: PASS" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "mode_routes=6" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "artifact_auditor_routes=4" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "ternary_transition_visualizer_routes=1" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "trace_explorer_routes=1" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "schema_aliases=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "metric_normalization=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m12-registry.txt"

          python - <<'PY'
          from dataclasses import FrozenInstanceError, replace
          from pathlib import Path

          from artifact_auditor.m31_published_boundary_intake import (
              M31PublishedDocumentRole,
          )
          from schemas.m31_published_registry import (
              M31_PUBLISHED_DOCUMENT_REGISTRATIONS,
              M31PublishedRegistryError,
              registration_for_m31_role,
              validate_m31_published_registry,
          )
          from schemas.registry import ObservatoryMode

          result = validate_m31_published_registry(Path("../upstream"))
          if len(result.registrations) != 4 or len(result.routes) != 6:
              raise SystemExit("M31 registry inventory mismatch")
          if tuple(
              registration.role
              for registration in result.registrations
          ) != tuple(M31PublishedDocumentRole):
              raise SystemExit("M31 registry role order mismatch")
          if len(
              result.routes_for_mode(ObservatoryMode.ARTIFACT_AUDITOR)
          ) != 4:
              raise SystemExit("M31 auditor route count mismatch")
          if len(
              result.routes_for_mode(
                  ObservatoryMode.TERNARY_TRANSITION_VISUALIZER
              )
          ) != 1:
              raise SystemExit("M31 visualizer route count mismatch")
          if len(
              result.routes_for_mode(ObservatoryMode.TRACE_EXPLORER)
          ) != 1:
              raise SystemExit("M31 explorer route count mismatch")
          try:
              registration_for_m31_role("evidence")
          except M31PublishedRegistryError:
              pass
          else:
              raise SystemExit("M31 string role alias was accepted")
          try:
              replace(
                  M31_PUBLISHED_DOCUMENT_REGISTRATIONS[1],
                  observatory_modes=(
                      ObservatoryMode.ARTIFACT_AUDITOR,
                  ),
              )
          except M31PublishedRegistryError:
              pass
          else:
              raise SystemExit("M31 route narrowing was accepted")
          try:
              result.registry_revision = "tampered"
          except FrozenInstanceError:
              pass
          else:
              raise SystemExit("M31 registry result is not frozen")
          print("M31 exact registry API qualification: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m12-tests.txt"

          grep -F "Ran 468 tests" \
            "$RUNNER_TEMP/frp-observatory-m12-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m12-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? schemas/m31_published_registry.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-registry-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 registry
        working-directory: observatory
        shell: bash
        env:
          REGISTRY_SOURCE_SHA256: 746a71a1fe2aaa1c367d1d6f6e2f65b0c32908ed89626b4d2335fe866f572e3e
        run: |
          set -euo pipefail
          target="schemas/m31_published_registry.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("schemas/m31_published_registry.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 registry source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["REGISTRY_SOURCE_SHA256"]:
              raise SystemExit(f"M31 registry digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 registry is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published document registry"
          git push origin HEAD:main

      - name: Publish M12 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M12"
            echo
            echo "- Exact M31 document registrations: 4"
            echo "- Exact Observatory mode routes: 6"
            echo "- Artifact Auditor routes: 4"
            echo "- Ternary Transition Visualizer routes: 1"
            echo "- Trace Explorer routes: 1"
            echo "- Schema aliases: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Source execution: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory registry files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
