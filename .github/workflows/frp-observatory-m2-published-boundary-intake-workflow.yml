          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["MODULE_GZIP_BASE64"].split())
          compressed = base64.b64decode(encoded, validate=True)
          source = gzip.decompress(compressed)
          expected = os.environ["MODULE_SHA256"]
          observed = hashlib.sha256(source).hexdigest()
          if observed != expected:
              raise SystemExit(
                  f"Decoded module digest mismatch: {observed} != {expected}"
              )
          target = Path("artifact_auditor/m30_published_boundary_intake.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source)
          if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
              raise SystemExit("Written module digest mismatch")
          print(f"Installed complete source: {target}")
          print(f"source_sha256={expected}")
          PY

      - name: Validate the complete published-byte boundary
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake \
            --archive "$archive"

          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake \
            --archive "$archive"

          PYTHONPATH=. python - <<'PY'
          from pathlib import Path

          from artifact_auditor.m30_published_boundary_intake import (
              validate_m30_published_boundary,
          )

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = validate_m30_published_boundary(archive)
          if len(result.documents) != 8:
              raise SystemExit("M28-M30 boundary document count mismatch")
          if result.supported_artifact_count != 97:
              raise SystemExit("M29 supported artifact count mismatch")
          if len(result.demo_members) != 4:
              raise SystemExit("M29 exact demo member count mismatch")
          if result.accepted_vector_count != 4:
              raise SystemExit("M29 accepted vector count mismatch")
          if result.rejected_vector_count != 8:
              raise SystemExit("M29 rejected vector count mismatch")
          print("Exact M28-M30 retained published-byte boundary: PASS")
          print("Immutable core -1/0/1: PASS")
          print("Temporal scheduler modes 1/7 and 7/1: PASS")
          print("One-way no-writeback Observatory boundary: PASS")
          PY

          python -m unittest discover -s tests -v 2>&1 | tee m2-tests.log
          grep -F "Ran 275 tests" m2-tests.log
          grep -Fx "OK" m2-tests.log
          rm -f m2-tests.log

      - name: Commit the complete published boundary intake source
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          target="artifact_auditor/m30_published_boundary_intake.py"
          git diff --check -- "$target"
          git add -- "$target"

          if git diff --cached --quiet; then
            echo "The exact M30 published boundary intake source is already current."
            exit 0
          fi

          changed="$(git diff --cached --name-only)"
          if [[ "$changed" != "$target" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Add M30 published-boundary intake validator" \
            -m "Validate the exact M28-M30 one-way FRP-to-Observatory boundary, all 97 registered artifacts, four canonical demo members, and compatibility vectors without extraction or source execution."
          git push origin HEAD:main
