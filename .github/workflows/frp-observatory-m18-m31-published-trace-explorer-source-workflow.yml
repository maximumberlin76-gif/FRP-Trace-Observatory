          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["SOURCE_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["SOURCE_BASE64_LENGTH"]):
              raise SystemExit("Trace Explorer payload length mismatch")
          if observed_encoded_sha256 != os.environ["SOURCE_BASE64_SHA256"]:
              raise SystemExit("Trace Explorer payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["SOURCE_GZIP_LENGTH"]):
              raise SystemExit("Compressed Trace Explorer length mismatch")
          if observed_compressed_sha256 != os.environ["SOURCE_GZIP_SHA256"]:
              raise SystemExit("Compressed Trace Explorer digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["SOURCE_LENGTH"]):
              raise SystemExit("Decoded Trace Explorer length mismatch")
          if source.count(b"\n") != int(os.environ["SOURCE_LINES"]):
              raise SystemExit("Decoded Trace Explorer line-count mismatch")
          if observed_source_sha256 != os.environ["SOURCE_SHA256"]:
              raise SystemExit("Decoded Trace Explorer digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit(
                  "Decoded Trace Explorer terminal newline mismatch"
              )

          parent = Path("trace_explorer")
          target = parent / "m31_published_trace_explorer.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("trace_explorer package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 Trace Explorer target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 Trace Explorer"
                  )
              print("Exact M31 Trace Explorer source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 Trace Explorer source")

          if target.read_bytes() != source:
              raise SystemExit(
                  "Installed M31 Trace Explorer verification failed"
              )
          print(f"trace_explorer_bytes={len(source)}")
          print(f"trace_explorer_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 Trace Explorer and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m18-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m trace_explorer.m31_published_trace_explorer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m18-trace-explorer.txt"

          result="$RUNNER_TEMP/frp-observatory-m18-trace-explorer.txt"
          grep -Fx \
            "FRP Observatory M31 published Trace Explorer: PASS" \
            "$result"
          grep -Fx "registry_revision=m31-published-boundary-v1" "$result"
          grep -Fx \
            "evidence_raw_sha256=bdaa676acbfb09d86d848070e8a2673c5ce6902657a0b13b2e4293383bec8b42" \
            "$result"
          grep -Fx "trace_contours=2" "$result"
          grep -Fx "records=100" "$result"
          grep -Fx "cell_snapshots=800" "$result"
          grep -Fx "requests=200" "$result"
          grep -Fx "invariant_pass_records=100" "$result"
          grep -Fx "active_zero_after_observations=702" "$result"
          grep -Fx "observed_scheduler_modes=free,7/1,1/7" "$result"
          grep -Fx "observed_ternary_domain=-1/0/1" "$result"
          grep -Fx \
            'event_totals={"actual_direct_events": 0, "neutral_routed_events": 5, "prevented_direct_events": 5, "queue_overflow_events": 0, "requested_direct_events": 5, "reserved_state_events": 0}' \
            "$result"
          grep -Fx \
            'retained_transition_totals={"active_zero_to_polarity": 12, "direct_opposite": 0, "polarity_to_active_zero": 5, "retained_same": 783}' \
            "$result"
          grep -Fx \
            "contour[0]=artifacts/m19/execution/m16-rtl-execution-trace.json|records=96|source_record_digest=3f730a3d088e4d75fdd1631dd234878a6acd3a7561cb463e19c815096c04fe6a|contour_sha256=23a0af37356389dc6ffd4ab2bac4a0cf64a418583ed43195b44193dacc3c4600" \
            "$result"
          grep -Fx \
            "contour[1]=artifacts/m19/execution/m16-fpga-preparation-execution-trace.json|records=4|source_record_digest=4b2e8aec64a0b3cb76d0819383ed66d306b8e50dc3feb7bb8c6c76486cd83d57|contour_sha256=3e06ba60c8fb3bab08eabd83b9a3d83dee0176c6a682bb2825d2bba9d62dee94" \
            "$result"
          grep -Fx \
            "dataset_sha256=ef5a040c9d30d02f90003e007e447cf0d66238f31ed27e3be92bdce31ad19fff" \
            "$result"
          grep -Fx "source_execution=forbidden" "$result"
          grep -Fx "metric_normalization=forbidden" "$result"
          grep -Fx "thermal_contour_merging=forbidden" "$result"
          grep -Fx "semantic_reimplementation=forbidden" "$result"
          grep -Fx "source_mutation=forbidden" "$result"
          grep -Fx "downstream_writeback=forbidden" "$result"

          python - <<'PY'
          from dataclasses import FrozenInstanceError, replace
          from datetime import datetime, timezone
          from pathlib import Path

          from trace_explorer.m31_published_trace_explorer import (
              M31PublishedTraceError,
              build_m31_published_trace_dataset,
              explore_m31_published_documents,
          )

          root = Path("../upstream")
          first = explore_m31_published_documents(
              root,
              loaded_at=datetime(2026, 1, 1, tzinfo=timezone.utc),
          )
          second = explore_m31_published_documents(
              root,
              loaded_at=datetime(2026, 2, 1, tzinfo=timezone.utc),
          )
          if (
              first.dataset_sha256
              != "ef5a040c9d30d02f90003e007e447cf0"
                 "d66238f31ed27e3be92bdce31ad19fff"
              or first.dataset_sha256 != second.dataset_sha256
          ):
              raise SystemExit("M31 Trace Explorer dataset is not deterministic")
          if (
              first.trace_dataset_id
              != "0f0f0f7e-0409-5e7b-8c76-2f72bb954321"
              or first.trace_dataset_id != second.trace_dataset_id
          ):
              raise SystemExit("M31 Trace Explorer identifier mismatch")
          expected_contours = (
              (
                  "artifacts/m19/execution/m16-rtl-execution-trace.json",
                  96,
                  "3f730a3d088e4d75fdd1631dd234878a"
                  "6acd3a7561cb463e19c815096c04fe6a",
                  "23a0af37356389dc6ffd4ab2bac4a0cf"
                  "64a418583ed43195b44193dacc3c4600",
                  "ee01676e-76f9-5197-9ed9-e80d9b5187a1",
              ),
              (
                  "artifacts/m19/execution/"
                  "m16-fpga-preparation-execution-trace.json",
                  4,
                  "4b2e8aec64a0b3cb76d0819383ed66d3"
                  "06b8e50dc3feb7bb8c6c76486cd83d57",
                  "3e06ba60c8fb3bab08eabd83b9a3d83d"
                  "ee0176c6a682bb2825d2bba9d62dee94",
                  "9bc92fca-0db1-57ae-8951-398a7f059336",
              ),
          )
          observed_contours = tuple(
              (
                  contour.source_path,
                  contour.record_count,
                  contour.source_record_digest,
                  contour.contour_sha256,
                  contour.trace_contour_id,
              )
              for contour in first.contours
          )
          if observed_contours != expected_contours:
              raise SystemExit("M31 trace contour ledger mismatch")
          if tuple(
              contour.contour_sha256 for contour in first.contours
          ) != tuple(
              contour.contour_sha256 for contour in second.contours
          ):
              raise SystemExit("M31 contour digests are not deterministic")
          if tuple(
              record.trace_record_id for record in first.records
          ) != tuple(
              record.trace_record_id for record in second.records
          ):
              raise SystemExit("M31 trace record identifiers are not deterministic")
          if len({record.trace_record_id for record in first.records}) != 100:
              raise SystemExit("M31 trace record identifiers are not unique")
          if tuple(
              tuple(record.sequence for record in contour.records)
              for contour in first.contours
          ) != (tuple(range(96)), tuple(range(4))):
              raise SystemExit("M31 source-local record order changed")
          if tuple(
              tuple(epoch.epoch for epoch in contour.epochs)
              for contour in first.contours
          ) != ((0, 1, 2), (0, 1)):
              raise SystemExit("M31 source-local epoch order changed")
          if any(
              not contour.provenance_source.source_artifact.verify_integrity()
              for contour in first.contours
          ):
              raise SystemExit("M31 trace provenance integrity failed")
          if (
              first.record_count != 100
              or first.cell_snapshot_count != 800
              or first.request_count != 200
              or first.invariant_pass_record_count != 100
              or first.active_zero_after_observation_count != 702
          ):
              raise SystemExit("M31 projected trace inventory mismatch")
          if first.observed_ternary_domain != (-1, 0, 1):
              raise SystemExit("M31 projected ternary domain mismatch")
          try:
              build_m31_published_trace_dataset(None)
          except M31PublishedTraceError:
              pass
          else:
              raise SystemExit("Non-audit M31 input was accepted")
          try:
              first.dataset_sha256 = "0" * 64
          except (FrozenInstanceError, AttributeError):
              pass
          else:
              raise SystemExit("M31 trace dataset is mutable")
          try:
              replace(first, dataset_sha256="0" * 64)
          except M31PublishedTraceError:
              pass
          else:
              raise SystemExit("Forged M31 dataset digest was accepted")
          record = first.contours[0].records[0]
          forged_record = replace(record, source_record_sha256="0" * 64)
          try:
              replace(
                  first.contours[0],
                  records=(forged_record,) + first.contours[0].records[1:],
              )
          except M31PublishedTraceError:
              pass
          else:
              raise SystemExit("Forged M31 source-record digest was accepted")
          try:
              replace(
                  record.cells[0],
                  retained_state_before=-1,
                  retained_state_after=1,
              )
          except M31PublishedTraceError:
              pass
          else:
              raise SystemExit("Direct opposite transition was accepted")

          print("M18 deterministic Trace Explorer contract: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m18-full-tests.txt"

          grep -F "Ran 543 tests" \
            "$RUNNER_TEMP/frp-observatory-m18-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m18-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? trace_explorer/m31_published_trace_explorer.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-trace-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 Trace Explorer
        working-directory: observatory
        shell: bash
        env:
          SOURCE_SHA256: b0dac82ece92a0886c7ab968d3eed4e9df1ae76eb3d84bfe05bf19cb69ef2893
        run: |
          set -euo pipefail
          target="trace_explorer/m31_published_trace_explorer.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("trace_explorer/m31_published_trace_explorer.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 Trace Explorer source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["SOURCE_SHA256"]:
              raise SystemExit(
                  f"M31 Trace Explorer digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 Trace Explorer is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Trace Explorer"
          git push origin HEAD:main

