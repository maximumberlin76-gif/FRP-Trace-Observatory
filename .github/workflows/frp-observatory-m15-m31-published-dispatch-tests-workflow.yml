        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit("Dispatch test payload length mismatch")
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit("Dispatch test payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit("Compressed dispatch test length mismatch")
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit("Compressed dispatch test digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_SOURCE_LENGTH"]):
              raise SystemExit("Decoded dispatch test length mismatch")
          if source.count(b"\n") != int(os.environ["TEST_SOURCE_LINES"]):
              raise SystemExit("Decoded dispatch test line-count mismatch")
          if observed_source_sha256 != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit("Decoded dispatch test digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded dispatch test newline mismatch")

          parent = Path("tests")
          target = parent / "test_m31_published_dispatch.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("tests package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 dispatch test target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical M31 dispatch tests"
                  )
              print("Exact M31 dispatch tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 dispatch tests")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 dispatch test verification failed")
          print(f"dispatch_test_bytes={len(source)}")
          print(f"dispatch_test_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 dispatch tests and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m15-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m parsers.m31_published_dispatch \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"

          grep -Fx \
            "FRP Observatory M31 published dispatch boundary: PASS" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "dispatch_envelopes=6" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "artifact_auditor_dispatches=4" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "ternary_transition_visualizer_dispatches=1" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "trace_explorer_dispatches=1" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "legacy_schema_only_dispatch_reuse=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "mode_consumer_invocation=deferred" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m15-dispatch.txt"

          python -m unittest discover \
            -s tests \
            -p 'test_m31_published_dispatch.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m15-dedicated-tests.txt"

          grep -F "Ran 25 tests" \
            "$RUNNER_TEMP/frp-observatory-m15-dedicated-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m15-dedicated-tests.txt"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m15-full-tests.txt"

          grep -F "Ran 514 tests" \
            "$RUNNER_TEMP/frp-observatory-m15-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m15-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? tests/test_m31_published_dispatch.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-dispatch-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 dispatch tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SOURCE_SHA256: cf1689a9a930f6bd9a202f85318b5e5ccb8df3b262fb314b9de063e80769d3bb
        run: |
          set -euo pipefail
          target="tests/test_m31_published_dispatch.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("tests/test_m31_published_dispatch.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 dispatch tests are missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit(f"M31 dispatch test digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 dispatch tests are already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published dispatch tests"
          git push origin HEAD:main

