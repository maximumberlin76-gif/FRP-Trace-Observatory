name: FRP Observatory M5 Published Dispatch Boundary Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m5-published-dispatch-boundary-main
  cancel-in-progress: false

jobs:
  bootstrap-published-dispatch:
    name: Bootstrap seven immutable M30 member-to-mode dispatch envelopes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Require exact green M1 through M4 and dispatch dependencies
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = (
              (
                  Path("artifact_auditor/m30_archive_intake.py"),
                  "d1101f5baf74fdcea4d08a14e7b21e1a6657ca19eb29d8387aba15f3ac5d904d",
                  "M1 archive intake",
              ),
              (
                  Path("artifact_auditor/m30_published_boundary_intake.py"),
                  "4b1f580596425b15dd4548c30336db45a14b7aad4285feeb7cb490edc20b4b42",
                  "M2 published boundary intake",
              ),
              (
                  Path("schemas/m30_published_registry.py"),
                  "d2769b3444a836e17e41a47fd34ca9c792d0897cb68e345ed4f622ff72ec8ab0",
                  "M3 published registry",
              ),
              (
                  Path("tests/test_m30_published_registry.py"),
                  "310f5e50a06d3e36603d49114741f6f87622d2b9f419773aabe1b2c9facadb99",
                  "M3 published registry tests",
              ),
              (
                  Path("parsers/m30_published_member_intake.py"),
                  "827af9233facfee466606163589c0b068d107b05e6bb8cbff4245409a09c367a",
                  "M4 published member intake",
              ),
              (
                  Path("tests/test_m30_published_member_intake.py"),
                  "873bfa4c0d163b6a1b0df09873cdec6ecb39f12d496f49a76ec98bc5cda02c9e",
                  "M4 published member intake tests",
              ),
              (
                  Path("parsers/source_artifact.py"),
                  "dad32b37e8a14213d91c9bfb407129ebb077432a8a366ad6ddb9a78bc9a0d59e",
                  "immutable source capture",
              ),
              (
                  Path("parsers/json_artifact.py"),
                  "3164a5704404f6ef7a16cfd6954ec14c9b1c1c757da3e7584eb500798e071efb",
                  "strict JSON parser",
              ),
              (
                  Path("schemas/registry.py"),
                  "4d17a350bccd27edaafe1736a70ee153da426556355ce113416dbe6b596a43f2",
                  "Observatory mode registry",
              ),
              (
                  Path("parsers/artifact_dispatch.py"),
                  "abc765e34efd27a532b1fca0c91fc1982dbadd0a6d3d34b619e31225895cf050",
                  "legacy schema-only dispatch boundary",
              ),
          )
          for target, expected, label in requirements:
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact green {label} source is missing")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"{label} source mismatch: {observed} != {expected}"
                  )
              print(f"Exact green {label}: PASS")
          PY

      - name: Verify the exact upstream M30 package identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          expected_length = 10_189_989
          expected_digest = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Exact FRP M30 archival package is missing")
          raw = archive.read_bytes()
          if len(raw) != expected_length:
              raise SystemExit(
                  f"M30 package length mismatch: {len(raw)} != {expected_length}"
              )
          observed_digest = sha256(raw).hexdigest()
          if observed_digest != expected_digest:
              raise SystemExit(
                  "M30 package digest mismatch: "
                  f"{observed_digest} != {expected_digest}"
              )
          print("Exact FRP v3.2.0 / M30 package identity: PASS")
          PY

