            6y25ktN9ALnr2B9zebABunkDk9X+saD82v3Hg9H1/PZ2fvMHmr+a3UCuOT/lImFcXIg7KBVB4/Z+8KGUrjXupRsxeggKC1MtaRF5
            xGCpLIfbpfI+2Z3dWi2xOamz+vPL8hLdRxblv7QrIIYIUaghJIZ9CGmXl5qOkJxnIl2JsGrXi6f9Qe9/nEVXjCw0AAA=
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payloads = (
              (
                  "MODULE_GZIP_BASE64",
                  "MODULE_SHA256",
                  Path("parsers/m30_published_dispatch.py"),
              ),
              (
                  "TEST_GZIP_BASE64",
                  "TEST_SHA256",
                  Path("tests/test_m30_published_dispatch.py"),
              ),
          )
          for payload_name, digest_name, target in payloads:
              encoded = "".join(os.environ[payload_name].split())
              compressed = base64.b64decode(encoded, validate=True)
              source = gzip.decompress(compressed)
              expected = os.environ[digest_name]
              observed = hashlib.sha256(source).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Decoded {target} digest mismatch: "
                      f"{observed} != {expected}"
                  )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source)
              written = hashlib.sha256(target.read_bytes()).hexdigest()
              if written != expected:
                  raise SystemExit(
                      f"Written {target} digest mismatch: "
                      f"{written} != {expected}"
                  )
              print(f"Installed complete source: {target}")
              print(f"source_sha256={expected}")
          PY

      - name: Validate exact M30 dispatch boundary and complete Observatory tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q artifact_auditor parsers schemas trace_explorer transition_visualizer tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake --archive "$archive"
          PYTHONPATH=. python -m schemas.m30_published_registry --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_member_intake --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_dispatch --archive "$archive"

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          from parsers.artifact_dispatch import (
              RegistrationStatus,
              dispatch_artifact,
          )
          from parsers.m30_published_dispatch import (
              dispatch_m30_published_members,
          )
          from schemas.registry import ObservatoryMode

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = dispatch_m30_published_members(archive)

          expected_inventory = (
              (
                  "m16-fpga-preparation-execution-trace",
                  ObservatoryMode.ARTIFACT_AUDITOR,
              ),
              (
                  "m16-fpga-preparation-execution-trace",
                  ObservatoryMode.TERNARY_TRANSITION_VISUALIZER,
              ),
              (
                  "m16-fpga-preparation-execution-trace",
                  ObservatoryMode.TRACE_EXPLORER,
              ),
              (
                  "m27-telemetry-semantics",
                  ObservatoryMode.ARTIFACT_AUDITOR,
              ),
              (
                  "m27-telemetry-semantics",
                  ObservatoryMode.TERNARY_TRANSITION_VISUALIZER,
              ),
              (
                  "m28-trace-observatory-upstream-contract",
                  ObservatoryMode.ARTIFACT_AUDITOR,
              ),
              (
                  "m28-hierarchical-scaling-contract",
                  ObservatoryMode.ARTIFACT_AUDITOR,
              ),
          )
          observed_inventory = tuple(
              (dispatch.member_id, dispatch.mode)
              for dispatch in result.dispatches
          )
          if observed_inventory != expected_inventory:
              raise SystemExit("M5 dispatch inventory or order mismatch")

          expected_digests = (
              "28e808f6b49cf9123082a9ff1a9045a02b54071eff2431e1c38042fec791d4a1",
              "204c63f20db49a7d946b0963058db148fe43bb715c353c74ac4f6b203e4e792f",
              "55e9c53f55cc5507e33271bfcdd2a48c751fd710b9fe8f9df972fc1c308f69b2",
              "9c5191fec35bcde4aeb6faca6e8476bc7cb5a4e5ff11f6b5359d11b55db71d8c",
              "b17c84a8adc66205f75d8ae81053b181ba585647e8a5e29764f0d6ec062d4d21",
              "9fb6445250f6e29879a2433e9526d9f744bc2a3f10ee0a00be551e39cde4bdeb",
              "6b923c5d9e8a98130eef848ce43818f3ff76b44a9e9c3426ef6d681265c548d1",
          )
          observed_digests = tuple(
              dispatch.dispatch_sha256
              for dispatch in result.dispatches
          )
          if observed_digests != expected_digests:
              raise SystemExit("M5 deterministic dispatch digest mismatch")
          if len(set(observed_digests)) != 7:
              raise SystemExit("M5 dispatch digests are not unique")

          expected_pairs = tuple(
              (member, route)
              for member in result.intake_batch.members
              for route in member.routes
          )
          for dispatch, (member, route) in zip(
              result.dispatches,
              expected_pairs,
              strict=True,
          ):
              if dispatch.member is not member:
                  raise SystemExit("M5 member identity was reconstructed")
              if dispatch.route is not route:
                  raise SystemExit("M5 route evidence was reconstructed")
              if dispatch.source_artifact is not member.source_artifact:
                  raise SystemExit("M5 source identity was reconstructed")
              if dispatch.parsed_artifact is not member.parsed_artifact:
                  raise SystemExit("M5 parsed identity was reconstructed")
              if dispatch.raw_bytes != member.retained_member.raw_bytes:
                  raise SystemExit("M5 raw bytes changed")
              if sha256(dispatch.raw_bytes).hexdigest() != (
                  member.registration.raw_sha256
              ):
                  raise SystemExit("M5 raw-byte digest mismatch")

          expected_mode_counts = {
              ObservatoryMode.ARTIFACT_AUDITOR: 4,
              ObservatoryMode.TERNARY_TRANSITION_VISUALIZER: 2,
              ObservatoryMode.TRACE_EXPLORER: 1,
          }
          for mode, expected in expected_mode_counts.items():
              observed = len(result.dispatches_for_mode(mode))
              if observed != expected:
                  raise SystemExit(
                      f"{mode.value} dispatch count mismatch: "
                      f"{observed} != {expected}"
                  )

          m27 = result.intake_batch.members[1]
          if m27.parsed_artifact.root["artifact_id"] != (
              "frp-m27-telemetry-semantics"
          ):
              raise SystemExit("M27 artifact_id changed")
          if m27.parsed_artifact.root["schema_version"] != "2.9.0":
              raise SystemExit("M27 schema_version changed")
          if "schema" in m27.parsed_artifact.root:
              raise SystemExit("M27 received a synthetic schema field")
          legacy_result = dispatch_artifact(m27.source_artifact)
          if legacy_result.registration.status is not (
              RegistrationStatus.MISSING_IDENTIFIER
          ):
              raise SystemExit(
                  "Legacy schema-only dispatch unexpectedly accepted M27"
              )
          if len(result.dispatches_for_member(m27.member_id)) != 2:
              raise SystemExit("M5 M27 dispatch count mismatch")

          print("Exact seven immutable dispatch envelopes: PASS")
          print("Exact source-order member-to-mode inventory: PASS")
          print("Exact deterministic dispatch digest ledger: PASS")
          print("Exact 4/2/1 existing-mode distribution: PASS")
          print("M27 artifact_id plus schema_version identity: RETAINED")
          print("Legacy schema-only dispatch reuse: FORBIDDEN")
          print("Mode consumer invocation: DEFERRED")
          print("Source execution and semantic normalization: FORBIDDEN")
          print("Upstream mutation and downstream writeback: FORBIDDEN")
          PY

          FRP_M30_ARCHIVE_PATH="$archive" python -m unittest -v tests.test_m30_published_dispatch 2>&1 | tee m5-focused-tests.log
          grep -F "Ran 20 tests" m5-focused-tests.log
          grep -Fx "OK" m5-focused-tests.log
          rm -f m5-focused-tests.log

          FRP_M30_ARCHIVE_PATH="$archive" python -m unittest discover -s tests -v 2>&1 | tee m5-all-tests.log
          grep -F "Ran 351 tests" m5-all-tests.log
          grep -Fx "OK" m5-all-tests.log
          rm -f m5-all-tests.log

      - name: Commit the complete M30 published dispatch source and tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- parsers/m30_published_dispatch.py tests/test_m30_published_dispatch.py
          git add -- parsers/m30_published_dispatch.py tests/test_m30_published_dispatch.py

          if git diff --cached --quiet; then
            echo "The exact M30 published dispatch source and tests are already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^(parsers/m30_published_dispatch.py|tests/test_m30_published_dispatch.py)$' ||
              true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M30 published dispatch boundary" -m "Create seven immutable read-only dispatch envelopes for the exact M30-published members and their approved Observatory modes without reusing the legacy schema-only registry, invoking consumers, normalizing semantics, or writing upstream."
          git push origin HEAD:main
