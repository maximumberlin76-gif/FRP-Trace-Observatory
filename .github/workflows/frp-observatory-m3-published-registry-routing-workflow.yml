            y4yXRWaLPO0pJ/8Fpta73nZSAAA=
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payloads = (
              (
                  "MODULE_GZIP_BASE64",
                  "MODULE_SHA256",
                  Path("schemas/m30_published_registry.py"),
              ),
              (
                  "TEST_GZIP_BASE64",
                  "TEST_SHA256",
                  Path("tests/test_m30_published_registry.py"),
              ),
          )
          for payload_name, digest_name, target in payloads:
              encoded = "".join(os.environ[payload_name].split())
              compressed = base64.b64decode(encoded, validate=True)
              source = gzip.decompress(compressed)
              expected = os.environ[digest_name]
              observed = hashlib.sha256(source).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Decoded {target} digest mismatch: "
                      f"{observed} != {expected}"
                  )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source)
              written = hashlib.sha256(target.read_bytes()).hexdigest()
              if written != expected:
                  raise SystemExit(
                      f"Written {target} digest mismatch: "
                      f"{written} != {expected}"
                  )
              print(f"Installed complete source: {target}")
              print(f"source_sha256={expected}")
          PY

      - name: Validate exact M30 registration and three-mode routing
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake \
            --archive "$archive"

          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake \
            --archive "$archive"

          PYTHONPATH=. python -m schemas.m30_published_registry \
            --archive "$archive"

          PYTHONPATH=. python - <<'PY'
          from pathlib import Path

          from schemas.m30_published_registry import (
              validate_m30_published_registry,
          )
          from schemas.registry import ObservatoryMode

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = validate_m30_published_registry(archive)
          expected = {
              ObservatoryMode.ARTIFACT_AUDITOR: (
                  "m16-fpga-preparation-execution-trace",
                  "m27-telemetry-semantics",
                  "m28-trace-observatory-upstream-contract",
                  "m28-hierarchical-scaling-contract",
              ),
              ObservatoryMode.TERNARY_TRANSITION_VISUALIZER: (
                  "m16-fpga-preparation-execution-trace",
                  "m27-telemetry-semantics",
              ),
              ObservatoryMode.TRACE_EXPLORER: (
                  "m16-fpga-preparation-execution-trace",
              ),
          }
          for mode, member_ids in expected.items():
              observed = tuple(
                  route.registration.member_id
                  for route in result.routes_for_mode(mode)
              )
              if observed != member_ids:
                  raise SystemExit(
                      f"{mode.value} route mismatch: "
                      f"{observed!r} != {member_ids!r}"
                  )
          print("Exact four-member registration inventory: PASS")
          print("Exact 4/2/1 three-mode routing inventory: PASS")
          print("Schema aliases and semantic reimplementation: FORBIDDEN")
          print("Upstream mutation and downstream writeback: FORBIDDEN")
          PY

          python -m unittest -v tests.test_m30_published_registry \
            2>&1 | tee m3-focused-tests.log
          grep -F "Ran 29 tests" m3-focused-tests.log
          grep -Fx "OK" m3-focused-tests.log
          rm -f m3-focused-tests.log

          python -m unittest discover -s tests -v \
            2>&1 | tee m3-all-tests.log
          grep -F "Ran 304 tests" m3-all-tests.log
          grep -Fx "OK" m3-all-tests.log
          rm -f m3-all-tests.log

      - name: Commit the complete published registry source and tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "schemas/m30_published_registry.py"
            "tests/test_m30_published_registry.py"
          )
          git diff --check -- "${targets[@]}"
          git add -- "${targets[@]}"

          if git diff --cached --quiet; then
            echo "The exact M30 published registry source and tests are already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^(schemas/m30_published_registry.py|tests/test_m30_published_registry.py)$' ||
              true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Add M30 published member routing registry" \
            -m "Register four exact FRP published members across the existing Artifact Auditor, Ternary Transition Visualizer, and Trace Explorer modes without aliases or semantic reimplementation."
          git push origin HEAD:main
