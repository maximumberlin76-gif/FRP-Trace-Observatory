name: FRP Observatory M3 Published Registry Routing Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m3-published-registry-routing-main
  cancel-in-progress: false

jobs:
  bootstrap-published-registry-routing:
    name: Bootstrap exact M30 published member routing registry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Require the exact green M1 and M2 intake sources
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = (
              (
                  Path("artifact_auditor/m30_archive_intake.py"),
                  "d1101f5baf74fdcea4d08a14e7b21e1a6657ca19eb29d8387aba15f3ac5d904d",
                  "M1 archive intake",
              ),
              (
                  Path("artifact_auditor/m30_published_boundary_intake.py"),
                  "4b1f580596425b15dd4548c30336db45a14b7aad4285feeb7cb490edc20b4b42",
                  "M2 published boundary intake",
              ),
          )
          for target, expected, label in requirements:
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact green {label} source is missing")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"{label} source mismatch: {observed} != {expected}"
                  )
              print(f"Exact green {label} source: PASS")
          PY

      - name: Verify the exact upstream M30 package identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          expected_length = 10_189_989
          expected_digest = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Exact FRP M30 archival package is missing")
          raw = archive.read_bytes()
          if len(raw) != expected_length:
              raise SystemExit(
                  f"M30 package length mismatch: {len(raw)} != {expected_length}"
              )
          observed_digest = sha256(raw).hexdigest()
          if observed_digest != expected_digest:
              raise SystemExit(
                  "M30 package digest mismatch: "
                  f"{observed_digest} != {expected_digest}"
              )
          print("Exact FRP v3.2.0 / M30 package identity: PASS")
          PY

