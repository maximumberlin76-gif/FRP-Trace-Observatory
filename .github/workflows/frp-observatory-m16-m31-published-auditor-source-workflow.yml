        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["SOURCE_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["SOURCE_BASE64_LENGTH"]):
              raise SystemExit("M31 auditor payload length mismatch")
          if observed_encoded_sha256 != os.environ["SOURCE_BASE64_SHA256"]:
              raise SystemExit("M31 auditor payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["SOURCE_GZIP_LENGTH"]):
              raise SystemExit("Compressed M31 auditor length mismatch")
          if observed_compressed_sha256 != os.environ["SOURCE_GZIP_SHA256"]:
              raise SystemExit("Compressed M31 auditor digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["SOURCE_LENGTH"]):
              raise SystemExit("Decoded M31 auditor length mismatch")
          if source.count(b"\n") != int(os.environ["SOURCE_LINES"]):
              raise SystemExit("Decoded M31 auditor line-count mismatch")
          if observed_source_sha256 != os.environ["SOURCE_SHA256"]:
              raise SystemExit("Decoded M31 auditor digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded M31 auditor newline mismatch")

          parent = Path("artifact_auditor")
          target = parent / "m31_published_auditor.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("Artifact Auditor package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 auditor target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical M31 auditor source"
                  )
              print("Exact M31 auditor source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 auditor source")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 auditor verification failed")
          print(f"m31_auditor_bytes={len(source)}")
          print(f"m31_auditor_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 Artifact Auditor and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m16-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m artifact_auditor.m31_published_auditor \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"

          grep -Fx \
            "FRP Observatory M31 published Artifact Auditor: PASS" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "registry_revision=m31-published-boundary-v1" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "m30_archive_sha256=05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "audit_reports=4" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "validation_checks=47" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "failed_checks=0" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "batch_sha256=3e5eb2ad76f2605a49cc8a53902435bdcc1b52afac40dcdb3132fd33ce94d591" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "report=formal_schema contour=formal_schema_definition checks=11 status=recognized_valid sha256=5f18fd174e02f19adcac1809624a2c205b94ae6c226e05a20eaac4f896c6bb36" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "report=evidence contour=phase_interference_active_zero_thermal_evidence checks=16 status=recognized_valid sha256=e7c6163954973aa60994d2fa76f6f7edfdc6429fcbb397cf7e403a4e64f2f130" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "report=manifest contour=publication_manifest checks=10 status=recognized_valid sha256=e0ef32073524cd41ea2cf0b7b273ef3c63c61080e5ff72ae9e5432a81609d652" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx \
            "report=qualification contour=publication_qualification checks=10 status=recognized_valid sha256=5374a6b6e0def38ae5a50bb216c9be0396f6139f4a07e982b47e86b719414b53" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "source_execution=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "metric_normalization=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "thermal_contour_merging=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "semantic_reimplementation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m16-auditor.txt"

          python - <<'PY'
          from dataclasses import FrozenInstanceError
          from datetime import datetime, timezone

          from artifact_auditor.m31_published_auditor import (
              M31PublishedAuditorError,
              audit_m31_published_dispatch,
              audit_m31_published_documents,
          )
          from artifact_auditor.m31_published_boundary_intake import (
              M31PublishedDocumentRole,
          )
          from parsers.m31_published_dispatch import (
              dispatch_m31_published_documents,
          )
          from schemas.registry import ObservatoryMode

          root = "../upstream"
          first = audit_m31_published_documents(
              root,
              loaded_at=datetime(2026, 1, 1, tzinfo=timezone.utc),
          )
          second = audit_m31_published_documents(
              root,
              loaded_at=datetime(2026, 2, 1, tzinfo=timezone.utc),
          )
          if first.batch_sha256 != second.batch_sha256:
              raise SystemExit("M31 audit batch is not deterministic")
          if tuple(
              report.report_sha256 for report in first.reports
          ) != tuple(
              report.report_sha256 for report in second.reports
          ):
              raise SystemExit("M31 audit reports are not deterministic")
          if tuple(len(report.checks) for report in first.reports) != (
              11,
              16,
              10,
              10,
          ):
              raise SystemExit("M31 audit check inventory mismatch")
          if (
              first.total_check_count != 47
              or first.failed_check_count != 0
          ):
              raise SystemExit("M31 aggregate audit result mismatch")
          if tuple(report.role for report in first.reports) != tuple(
              M31PublishedDocumentRole
          ):
              raise SystemExit("M31 audit role order mismatch")
          check_ids = tuple(
              check.check_id
              for report in first.reports
              for check in report.checks
          )
          if len(check_ids) != 47 or len(set(check_ids)) != 47:
              raise SystemExit("M31 audit check identifiers mismatch")
          try:
              first.report_for_role("evidence")
          except M31PublishedAuditorError:
              pass
          else:
              raise SystemExit("M31 string role alias was accepted")

          dispatches = dispatch_m31_published_documents(root)
          visualizer = dispatches.dispatch_for(
              M31PublishedDocumentRole.EVIDENCE,
              ObservatoryMode.TERNARY_TRANSITION_VISUALIZER,
          )
          try:
              audit_m31_published_dispatch(visualizer)
          except M31PublishedAuditorError:
              pass
          else:
              raise SystemExit(
                  "M31 visualizer route was accepted by the auditor"
              )
          try:
              first.reports[0].report_sha256 = "0" * 64
          except (FrozenInstanceError, AttributeError):
              pass
          else:
              raise SystemExit("M31 audit report is mutable")

          print("M16 deterministic auditor contract: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m16-full-tests.txt"

          grep -F "Ran 514 tests" \
            "$RUNNER_TEMP/frp-observatory-m16-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m16-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? artifact_auditor/m31_published_auditor.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-auditor-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 Artifact Auditor
        working-directory: observatory
        shell: bash
        env:
          SOURCE_SHA256: efbcb971b946706e4102d4db37fb6fd2384ba2b63fefeadd1dc61cd78460dc66
        run: |
          set -euo pipefail
          target="artifact_auditor/m31_published_auditor.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("artifact_auditor/m31_published_auditor.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 auditor source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["SOURCE_SHA256"]:
              raise SystemExit(f"M31 auditor digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 auditor source is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Artifact Auditor"
          git push origin HEAD:main

      - name: Publish M16 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M16"
            echo
            echo "- Exact M31 published documents: 4"
            echo "- Artifact Auditor reports: 4"
            echo "- Deterministic validation checks: 47"
            echo "- Failed validation checks: 0"
            echo "- Complete Observatory tests: 514"
            echo "- Strict JSON replay: required"
            echo "- Source execution: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Thermal contour merging: forbidden"
            echo "- Semantic reimplementation: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory auditor source files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
