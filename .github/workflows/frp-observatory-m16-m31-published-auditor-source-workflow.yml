name: FRP Observatory M16 M31 Published Artifact Auditor Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m16-m31-published-auditor-source-main
  cancel-in-progress: false

jobs:
  publish-m31-auditor-source:
    name: Install and qualify exact M31 Artifact Auditor
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M15 dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/artifact_auditor/"
                  "m31_published_boundary_intake.py"
              ): (
                  32_266,
                  "f3cfcbc5c388065f8544b16c07bb988d"
                  "269ec3745d141de215ff48b0e72e277c",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_boundary_intake.py"
              ): (
                  22_234,
                  "6366338358552d27b038a0ff3f08b12e"
                  "8bb376f1b09afa7dd0e59fc0706cf1d7",
              ),
              Path(
                  "observatory/schemas/"
                  "m31_published_registry.py"
              ): (
                  22_102,
                  "746a71a1fe2aaa1c367d1d6f6e2f65b0"
                  "c32908ed89626b4d2335fe866f572e3e",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_registry.py"
              ): (
                  24_161,
                  "cd8e89b4682a794dd6543ba779f5758e7"
                  "6e4b344cbbc7c61341bd6caa2694970",
              ),
              Path(
                  "observatory/parsers/"
                  "m31_published_dispatch.py"
              ): (
                  16_928,
                  "7140a132f929076f22d2c4868b6a068e"
                  "a21c5593b9672bc45df6cb1e2b81c495",
              ),
              Path(
                  "observatory/tests/"
                  "test_m31_published_dispatch.py"
              ): (
                  23_063,
                  "cf1689a9a930f6bd9a202f85318b5e5c"
                  "cb8df3b262fb314b9de063e80769d3bb",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/artifact_auditor/m31_published_auditor.py"
          )
          expected_target_sha256 = (
              "efbcb971b946706e4102d4db37fb6fd2"
              "384ba2b63fefeadd1dc61cd78460dc66"
          )
          if target.is_symlink():
              raise SystemExit("M31 auditor target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit(
                      "M31 auditor target is not a regular file"
                  )
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "Unexpected M31 auditor source already exists: "
                      f"{observed}"
                  )
              print("Exact M31 auditor source is already present")
          else:
              print("M31 auditor source target is ready")

          print("Exact M15 dispatch boundary prerequisite: PASS")
          PY

