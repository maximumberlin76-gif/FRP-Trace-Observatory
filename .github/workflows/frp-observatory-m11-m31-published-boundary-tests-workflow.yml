          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit("Test payload length mismatch")
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit("Test payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit("Compressed test length mismatch")
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit("Compressed test digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_SOURCE_LENGTH"]):
              raise SystemExit("Decoded test length mismatch")
          if source.count(b"\n") != int(os.environ["TEST_SOURCE_LINES"]):
              raise SystemExit("Decoded test line-count mismatch")
          if observed_source_sha256 != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit("Decoded test digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded test terminal newline mismatch")

          parent = Path("tests")
          target = parent / "test_m31_published_boundary_intake.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("tests package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 test target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 test file"
                  )
              print("Exact M31 tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 tests")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 test verification failed")
          print(f"test_bytes={len(source)}")
          print(f"test_sha256={observed_source_sha256}")
          PY

      - name: Qualify exact M31 tests and full Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m11-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            tests \
            trace_explorer \
            transition_visualizer

          python -m unittest \
            tests.test_m31_published_boundary_intake \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m11-m31-tests.txt"

          grep -F "Ran 21 tests" \
            "$RUNNER_TEMP/frp-observatory-m11-m31-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m11-m31-tests.txt"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m11-full-tests.txt"

          grep -F "Ran 468 tests" \
            "$RUNNER_TEMP/frp-observatory-m11-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m11-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? tests/"
              "test_m31_published_boundary_intake.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SOURCE_SHA256: 6366338358552d27b038a0ff3f08b12e8bb376f1b09afa7dd0e59fc0706cf1d7
        run: |
          set -euo pipefail
          target="tests/test_m31_published_boundary_intake.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("tests/test_m31_published_boundary_intake.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 test file is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit(f"M31 test digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 tests are already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published boundary intake tests"
          git push origin HEAD:main

      - name: Publish M11 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M11"
            echo
            echo "- Exact M31 boundary tests: 21 PASS"
            echo "- Complete Observatory regression: 468 PASS"
            echo "- One-byte document tamper rejection: PASS"
            echo "- One-byte provenance tamper rejection: PASS"
            echo "- One-byte M30 archive tamper rejection: PASS"
            echo "- Upstream source execution: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory test files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
