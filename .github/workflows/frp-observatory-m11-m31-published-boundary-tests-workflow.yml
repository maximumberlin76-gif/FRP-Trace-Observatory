name: FRP Observatory M11 M31 Published Boundary Tests

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m11-m31-published-boundary-tests-main
  cancel-in-progress: false

jobs:
  publish-m31-boundary-tests:
    name: Install and qualify exact M31 boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M10 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/.github/workflows/"
                  "frp-observatory-m10-m31-published-boundary-"
                  "source-workflow.yml"
              ): (
                  28_577,
                  "fc7c8f6d2a8be25b6379327d4ccd7b37"
                  "78d18ac47d029b0fbb785c3284cb3444",
              ),
              Path(
                  "observatory/artifact_auditor/"
                  "m31_published_boundary_intake.py"
              ): (
                  32_266,
                  "f3cfcbc5c388065f8544b16c07bb988d"
                  "269ec3745d141de215ff48b0e72e277c",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/tests/"
              "test_m31_published_boundary_intake.py"
          )
          expected_target_sha256 = (
              "6366338358552d27b038a0ff3f08b12e"
              "8bb376f1b09afa7dd0e59fc0706cf1d7"
          )
          if target.is_symlink():
              raise SystemExit("M31 test target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit("M31 test target is not a regular file")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "An unexpected M31 test file already exists: "
                      f"{observed}"
                  )
              print("Exact M31 tests are already present")
          else:
              print("M31 test target is ready")

          print("Exact M10 workflow prerequisite: PASS")
          print("Exact M31 intake source prerequisite: PASS")
          PY

