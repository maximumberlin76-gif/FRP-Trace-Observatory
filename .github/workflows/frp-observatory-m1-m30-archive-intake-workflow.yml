        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["MODULE_GZIP_BASE64"].split())
          compressed = base64.b64decode(encoded, validate=True)
          source = gzip.decompress(compressed)
          expected = os.environ["MODULE_SHA256"]
          observed = hashlib.sha256(source).hexdigest()
          if observed != expected:
              raise SystemExit(
                  f"Decoded module digest mismatch: {observed} != {expected}"
              )
          target = Path("artifact_auditor/m30_archive_intake.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source)
          if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
              raise SystemExit("Written module digest mismatch")
          print(f"Installed complete source: {target}")
          print(f"source_sha256={expected}")
          PY

      - name: Validate the complete Observatory repository and M30 intake
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake \
            --archive \
            ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz

          PYTHONPATH=. python - <<'PY'
          from pathlib import Path

          from artifact_auditor.m30_archive_intake import validate_m30_archive

          member_path = (
              "artifacts/m28/contracts/"
              "m28-trace-observatory-upstream-contract.json"
          )
          archive_path = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = validate_m30_archive(
              archive_path,
              retain_paths=(member_path,),
          )
          retained = result.retained_member(member_path)
          if not retained.raw_bytes.startswith(b"{"):
              raise SystemExit("Retained M28 contract is not exact JSON bytes")
          if retained.member != result.member(member_path):
              raise SystemExit("Retained M28 member metadata mismatch")
          print("Exact retained-member boundary: PASS")
          PY

          python -m unittest discover -s tests -v 2>&1 | tee m1-tests.log
          grep -F "Ran 275 tests" m1-tests.log
          grep -Fx "OK" m1-tests.log
          rm -f m1-tests.log

      - name: Commit the complete archive intake source
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          target="artifact_auditor/m30_archive_intake.py"
          git diff --check -- "${target}"
          git add -- "${target}"

          if git diff --cached --quiet; then
            echo "The exact M30 archive intake source is already current."
            exit 0
          fi

          changed="$(git diff --cached --name-only)"
          if [[ "${changed}" != "${target}" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "${changed}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Add M30 archival release intake validator" \
            -m "Validate the exact FRP v3.2.0 archive, all 519 tar members, and all 518 internal manifest records without extraction or source execution."
          git push origin HEAD:main
