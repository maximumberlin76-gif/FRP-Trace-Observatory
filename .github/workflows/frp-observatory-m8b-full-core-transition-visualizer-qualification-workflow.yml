name: FRP Observatory M8B Full Core Transition Visualizer Qualification Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m8b-transition-visualizer-qualification-main
  cancel-in-progress: false

jobs:
  qualify-full-core-transition-visualizer:
    name: Qualify exact M8 full-core Transition Visualizer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M8 source and FRP upstream boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/transition_visualizer/"
                  "m30_published_transition_visualizer.py"
              ): (
                  "c8fab9a1f6091122043d297fab9419c2"
                  "1ea4b21b49bc2da0da132fa2662386dc"
              ),
              Path(
                  "observatory/trace_explorer/"
                  "m30_published_trace_explorer.py"
              ): (
                  "986335318fac7dbc894ab18133645653"
                  "e712944e2997aaaf484e1c7a46f1c879"
              ),
              Path(
                  "upstream/.github/workflows/"
                  "frp-m30-observatory-full-core-trace-"
                  "qualification-workflow.yml"
              ): (
                  "01ca22bc98f63d9d4ea4a58299d53ff"
                  "58b410f3f2db94b81097d7cef3ad4dee7"
              ),
          }
          for target, expected in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Prerequisite mismatch for {target}: "
                      f"{observed} != {expected}"
                  )

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Exact M30 archival release is missing")
          raw = archive.read_bytes()
          expected_length = 10_189_989
          expected_sha256 = (
              "05ea33f6f3f505d315af930c2d51779f"
              "7189905308473f32a57375e477069caa"
          )
          observed_sha256 = sha256(raw).hexdigest()
          if len(raw) != expected_length:
              raise SystemExit(
                  f"M30 archive length mismatch: "
                  f"{len(raw)} != {expected_length}"
              )
          if observed_sha256 != expected_sha256:
              raise SystemExit(
                  f"M30 archive digest mismatch: "
                  f"{observed_sha256} != {expected_sha256}"
              )

          test_target = Path(
              "observatory/tests/"
              "test_m30_published_transition_visualizer.py"
          )
          if test_target.is_symlink():
              raise SystemExit("M8 qualification test target is a symlink")

          print("Exact M8 source boundary: PASS")
          print("Exact FRP M30 upstream boundary: PASS")
          PY

