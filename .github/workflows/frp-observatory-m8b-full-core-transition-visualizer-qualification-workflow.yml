        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_XZ_BASE64"].split())
          expected_encoded_length = int(
              os.environ["TEST_BASE64_LENGTH"]
          )
          expected_encoded_sha256 = os.environ[
              "TEST_BASE64_SHA256"
          ]
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != expected_encoded_length:
              raise SystemExit(
                  "Test payload length mismatch: "
                  f"{len(encoded)} != {expected_encoded_length}"
              )
          if observed_encoded_sha256 != expected_encoded_sha256:
              raise SystemExit(
                  "Test payload digest mismatch: "
                  f"{observed_encoded_sha256} != "
                  f"{expected_encoded_sha256}"
              )

          compressed = base64.b64decode(encoded, validate=True)
          expected_compressed_length = int(
              os.environ["TEST_XZ_LENGTH"]
          )
          expected_compressed_sha256 = os.environ["TEST_XZ_SHA256"]
          observed_compressed_sha256 = hashlib.sha256(
              compressed
          ).hexdigest()
          if len(compressed) != expected_compressed_length:
              raise SystemExit(
                  "Compressed test length mismatch: "
                  f"{len(compressed)} != {expected_compressed_length}"
              )
          if (
              observed_compressed_sha256
              != expected_compressed_sha256
          ):
              raise SystemExit(
                  "Compressed test digest mismatch: "
                  f"{observed_compressed_sha256} != "
                  f"{expected_compressed_sha256}"
              )

          source = lzma.decompress(
              compressed,
              format=lzma.FORMAT_XZ,
          )
          expected_source_length = int(
              os.environ["TEST_SOURCE_LENGTH"]
          )
          expected_source_lines = int(
              os.environ["TEST_SOURCE_LINES"]
          )
          expected_source_sha256 = os.environ["TEST_SOURCE_SHA256"]
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != expected_source_length:
              raise SystemExit(
                  "Decoded test length mismatch: "
                  f"{len(source)} != {expected_source_length}"
              )
          if len(source.splitlines()) != expected_source_lines:
              raise SystemExit(
                  "Decoded test line-count mismatch: "
                  f"{len(source.splitlines())} != "
                  f"{expected_source_lines}"
              )
          if observed_source_sha256 != expected_source_sha256:
              raise SystemExit(
                  "Decoded test digest mismatch: "
                  f"{observed_source_sha256} != "
                  f"{expected_source_sha256}"
              )

          target = Path(
              "tests/test_m30_published_transition_visualizer.py"
          )
          if target.is_symlink():
              raise SystemExit("M8 qualification test target is a symlink")
          target.write_bytes(source)

          written_sha256 = hashlib.sha256(
              target.read_bytes()
          ).hexdigest()
          if written_sha256 != expected_source_sha256:
              raise SystemExit(
                  "Written M8 qualification test digest mismatch"
              )

          print("Complete M8 qualification tests: INSTALLED")
          print(f"test_bytes={len(source)}")
          print(f"test_lines={len(source.splitlines())}")
          print(f"test_sha256={written_sha256}")
          PY

      - name: Run focused M8 qualification and complete regression
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m \
            transition_visualizer.m30_published_transition_visualizer \
            --archive "$archive" \
            2>&1 | tee m8-source-output.log

          grep -Fx "trace_sources=2" m8-source-output.log
          grep -Fx "trace_records=100" m8-source-output.log
          grep -Fx "transition_frames=800" m8-source-output.log
          grep -Fx "balanced_ternary_notation=-1/0/1" \
            m8-source-output.log
