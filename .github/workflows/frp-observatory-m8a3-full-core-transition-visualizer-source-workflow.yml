          import base64
          import hashlib
          import lzma
          import os
          from pathlib import Path

          specifications = (
              (
                  Path(
                      "bootstrap/m8/"
                      "m30_published_transition_visualizer.xz.b64.part01"
                  ),
                  6800,
                  (
                      "b68f98139fe4c921cab19ed554f59432"
                      "c43e81e226be78f0ae846b4c139b4cf5"
                  ),
              ),
              (
                  Path(
                      "bootstrap/m8/"
                      "m30_published_transition_visualizer.xz.b64.part02"
                  ),
                  6800,
                  (
                      "aa391c1b1fcabf4398bea9780c9e5caa"
                      "4b169f795dfc15cdc9f9e9f1f1528a38"
                  ),
              ),
          )
          segments = []

          for path, expected_length, expected_sha256 in specifications:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Required verified payload segment is missing: {path}"
                  )
              encoded = "".join(
                  path.read_text(encoding="ascii").split()
              )
              observed_sha256 = hashlib.sha256(
                  encoded.encode("ascii")
              ).hexdigest()
              if len(encoded) != expected_length:
                  raise SystemExit(
                      f"Payload segment length mismatch for {path}: "
                      f"{len(encoded)} != {expected_length}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Payload segment digest mismatch for {path}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )
              base64.b64decode(encoded, validate=True)
              segments.append(encoded)

          part_three = "".join(
              os.environ["PART_THREE_BASE64"].split()
          )
          expected_part_three_length = int(
              os.environ["PART_THREE_LENGTH"]
          )
          expected_part_three_sha256 = os.environ[
              "PART_THREE_SHA256"
          ]
          observed_part_three_sha256 = hashlib.sha256(
              part_three.encode("ascii")
          ).hexdigest()
          if len(part_three) != expected_part_three_length:
              raise SystemExit(
                  "Payload segment 3 length mismatch: "
                  f"{len(part_three)} != "
                  f"{expected_part_three_length}"
              )
          if (
              observed_part_three_sha256
              != expected_part_three_sha256
          ):
              raise SystemExit(
                  "Payload segment 3 digest mismatch: "
                  f"{observed_part_three_sha256} != "
                  f"{expected_part_three_sha256}"
              )
          base64.b64decode(part_three, validate=True)
          segments.append(part_three)

          encoded_source = "".join(segments)
          expected_encoded_length = 20_408
          expected_encoded_sha256 = (
              "1a969568adff2b930f152a581bd01c3f"
              "2132c8630608a2bd264d592c432c00f1"
          )
          observed_encoded_sha256 = hashlib.sha256(
              encoded_source.encode("ascii")
          ).hexdigest()
          if len(encoded_source) != expected_encoded_length:
              raise SystemExit(
                  "Combined payload length mismatch: "
                  f"{len(encoded_source)} != "
                  f"{expected_encoded_length}"
              )
          if observed_encoded_sha256 != expected_encoded_sha256:
              raise SystemExit(
                  "Combined payload digest mismatch: "
                  f"{observed_encoded_sha256} != "
                  f"{expected_encoded_sha256}"
              )

          compressed = base64.b64decode(
              encoded_source,
              validate=True,
          )
          expected_compressed_length = 15_304
          expected_compressed_sha256 = (
              "555d85894783a805ed6330006c87371a1"
              "280c283ed28eeb72e034aa306768eb0"
          )
          observed_compressed_sha256 = hashlib.sha256(
              compressed
          ).hexdigest()
          if len(compressed) != expected_compressed_length:
              raise SystemExit(
                  "Compressed source length mismatch: "
                  f"{len(compressed)} != "
                  f"{expected_compressed_length}"
              )
          if (
              observed_compressed_sha256
              != expected_compressed_sha256
          ):
              raise SystemExit(
                  "Compressed source digest mismatch: "
                  f"{observed_compressed_sha256} != "
                  f"{expected_compressed_sha256}"
              )

          source = lzma.decompress(
              compressed,
              format=lzma.FORMAT_XZ,
          )
          expected_source_length = 94_148
          expected_source_lines = 2_593
          expected_source_sha256 = (
              "c8fab9a1f6091122043d297fab9419c2"
              "1ea4b21b49bc2da0da132fa2662386dc"
          )
          observed_source_sha256 = hashlib.sha256(
              source
          ).hexdigest()
          if len(source) != expected_source_length:
              raise SystemExit(
                  "Decoded source length mismatch: "
                  f"{len(source)} != {expected_source_length}"
              )
          if len(source.splitlines()) != expected_source_lines:
              raise SystemExit(
                  "Decoded source line-count mismatch: "
                  f"{len(source.splitlines())} != "
                  f"{expected_source_lines}"
              )
          if observed_source_sha256 != expected_source_sha256:
              raise SystemExit(
                  "Decoded source digest mismatch: "
                  f"{observed_source_sha256} != "
                  f"{expected_source_sha256}"
              )

          target = Path(
              "transition_visualizer/"
              "m30_published_transition_visualizer.py"
          )
          if target.exists() or target.is_symlink():
              raise SystemExit(
                  "M8 source target must not already exist"
              )
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source)

          written = target.read_bytes()
          written_sha256 = hashlib.sha256(written).hexdigest()
          if written != source or written_sha256 != expected_source_sha256:
              raise SystemExit(
                  "Written M8 source differs from exact payload"
              )

          print("Exact M8 source assembly: PASS")
          print(f"source_bytes={len(written)}")
          print(f"source_lines={len(written.splitlines())}")
          print(f"source_sha256={written_sha256}")
          PY

      - name: Validate exact M8 full-core output and complete regression
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
