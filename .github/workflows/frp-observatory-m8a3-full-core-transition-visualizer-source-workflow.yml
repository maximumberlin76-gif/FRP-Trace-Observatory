name: FRP Observatory M8A3 Full Core Transition Visualizer Source Assembly

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m8a3-transition-visualizer-payload-main
  cancel-in-progress: false

jobs:
  assemble-full-core-transition-visualizer-source:
    name: Assemble and validate exact M8 full-core source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify the exact green M7 and upstream boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/artifact_auditor/"
                  "m30_published_auditor.py"
              ): (
                  "3964ffaf2c0c51ba15a637ee3c18897d"
                  "e966d4b32e7931aabdd0d52c97c7de59"
              ),
              Path(
                  "observatory/trace_explorer/"
                  "m30_published_trace_explorer.py"
              ): (
                  "986335318fac7dbc894ab18133645653"
                  "e712944e2997aaaf484e1c7a46f1c879"
              ),
              Path(
                  "observatory/tests/"
                  "test_m30_published_trace_explorer.py"
              ): (
                  "a9f37c8a13652dcd1aaa0beb68ac44e"
                  "9b118af6f38e893ac4dce08031c77a24e"
              ),
              Path(
                  "upstream/.github/workflows/"
                  "frp-m30-observatory-full-core-trace-"
                  "qualification-workflow.yml"
              ): (
                  "01ca22bc98f63d9d4ea4a58299d53ff"
                  "58b410f3f2db94b81097d7cef3ad4dee7"
              ),
          }

          for target, expected in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Prerequisite mismatch for {target}: "
                      f"{observed} != {expected}"
                  )

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Exact M30 archival release is missing")
          raw = archive.read_bytes()
          expected_length = 10_189_989
          expected_sha256 = (
              "05ea33f6f3f505d315af930c2d51779f"
              "7189905308473f32a57375e477069caa"
          )
          observed_sha256 = sha256(raw).hexdigest()
          if len(raw) != expected_length:
              raise SystemExit(
                  f"M30 archive length mismatch: "
                  f"{len(raw)} != {expected_length}"
              )
          if observed_sha256 != expected_sha256:
              raise SystemExit(
                  f"M30 archive digest mismatch: "
                  f"{observed_sha256} != {expected_sha256}"
              )

          source = Path(
              "observatory/transition_visualizer/"
              "m30_published_transition_visualizer.py"
          )
          if source.exists() or source.is_symlink():
              raise SystemExit(
                  "M8 source already exists; do not reassemble it"
              )

          part_one = Path(
              "observatory/bootstrap/m8/"
              "m30_published_transition_visualizer.xz.b64.part01"
          )
          if part_one.is_symlink() or not part_one.is_file():
              raise SystemExit(
                  "Verified M8 payload segment 1 must be committed first"
              )
          encoded = "".join(
              part_one.read_text(encoding="ascii").split()
          )
          expected_part_one_length = 6800
          expected_part_one_sha256 = (
              "b68f98139fe4c921cab19ed554f59432"
              "c43e81e226be78f0ae846b4c139b4cf5"
          )
          observed_part_one_sha256 = sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != expected_part_one_length:
              raise SystemExit(
                  "M8 payload segment 1 length mismatch: "
                  f"{len(encoded)} != {expected_part_one_length}"
              )
          if observed_part_one_sha256 != expected_part_one_sha256:
              raise SystemExit(
                  "M8 payload segment 1 digest mismatch: "
                  f"{observed_part_one_sha256} != "
                  f"{expected_part_one_sha256}"
              )

          print("Exact green M7 dependency boundary: PASS")
          print("Exact FRP M30 full-core upstream boundary: PASS")
          PY

