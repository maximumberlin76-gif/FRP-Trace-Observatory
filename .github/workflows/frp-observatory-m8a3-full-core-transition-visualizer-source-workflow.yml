      - name: Commit exact M8 source and remove staged payload segments
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          source="transition_visualizer/m30_published_transition_visualizer.py"
          part_one="bootstrap/m8/m30_published_transition_visualizer.xz.b64.part01"
          part_two="bootstrap/m8/m30_published_transition_visualizer.xz.b64.part02"

          git diff --check -- "$source" "$part_one" "$part_two"
          git add -- "$source"
          git rm -- "$part_one" "$part_two"

          expected_paths="$(
            printf '%s\n' "$part_one" "$part_two" "$source" |
              sort
          )"
          staged_paths="$(
            git diff --cached --name-only |
              sort
          )"
          if [[ "$staged_paths" != "$expected_paths" ]]; then
            echo "Unexpected staged path set:"
            printf '%s\n' "$staged_paths"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Add Observatory M8 full-core Transition Visualizer source" \
            -m "Assemble the exact verified M8 source from three independently hashed XZ/Base64 segments, validate both M16 contours, preserve kernel -1/0/1 with active neutral 0 and scheduler modes 1/7 and 7/1, run the complete Observatory regression, and remove the two temporary staged payload segments. The Observatory remains read-only toward FRP upstream."

          git push origin HEAD:main
