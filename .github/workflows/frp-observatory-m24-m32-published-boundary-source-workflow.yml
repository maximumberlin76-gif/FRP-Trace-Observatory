            xwAA
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["MODULE_GZIP_BASE64"].split())
          encoded_bytes = encoded.encode("ascii")
          if len(encoded_bytes) != int(os.environ["MODULE_BASE64_LENGTH"]):
              raise SystemExit("Encoded module length mismatch")
          if (
              hashlib.sha256(encoded_bytes).hexdigest()
              != os.environ["MODULE_BASE64_SHA256"]
          ):
              raise SystemExit("Encoded module digest mismatch")

          try:
              compressed = base64.b64decode(encoded_bytes, validate=True)
          except (ValueError, base64.binascii.Error) as exc:
              raise SystemExit(f"Invalid encoded module payload: {exc}") from exc
          if len(compressed) != int(os.environ["MODULE_GZIP_LENGTH"]):
              raise SystemExit("Compressed module length mismatch")
          if (
              hashlib.sha256(compressed).hexdigest()
              != os.environ["MODULE_GZIP_SHA256"]
          ):
              raise SystemExit("Compressed module digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["MODULE_SOURCE_LENGTH"]):
              raise SystemExit("Decoded module length mismatch")
          if source.count(b"\n") != int(os.environ["MODULE_SOURCE_LINES"]):
              raise SystemExit("Decoded module line-count mismatch")
          if observed_source_sha256 != os.environ["MODULE_SOURCE_SHA256"]:
              raise SystemExit("Decoded module digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded module terminal newline mismatch")

          parent = Path("artifact_auditor")
          target = parent / "m32_published_boundary_intake.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("artifact_auditor package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M32 intake source target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M32 intake source"
                  )
              print("Exact M32 intake source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M32 intake source")

          installed = target.read_bytes()
          if installed != source:
              raise SystemExit("Installed M32 intake source verification failed")
          print(f"module_bytes={len(installed)}")
          print(f"module_sha256={observed_source_sha256}")
          PY

      - name: Qualify complete read-only M32 source
        working-directory: observatory
        shell: bash
        env:
          UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: >-
            ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          FRP_M31_UPSTREAM_ROOT: ../upstream
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m24-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          python -m artifact_auditor.m32_published_boundary_intake \
            --upstream-root "$UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m24-intake.txt"

          grep -Fx \
            "FRP Observatory M32 published boundary intake: PASS" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "registry_revision=m32-published-boundary-v1" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "published_document_bytes=458096" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx \
            "source_commit=c0bc0fbc2c1c2e500b19d0ba84b3431a813e3941" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "source_identities=29" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "source_identity_bytes=442916" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "transcript_identities=4" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "transcript_identity_bytes=436132" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "scheduler_traces=2" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "source_ticks=33" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "structured_trace_records=396" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "active_zero_cell_observations=238" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "balanced_ternary_notation=-1/0/1" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "opposite_transition_routes=-1/0/1,1/0/-1" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "direct_opposite_transitions=0" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "reserved_state_events=0" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "queue_overflow_events=0" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "transient_workflow_artifact_reads=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "record_normalization=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m24-intake.txt"

          python - <<'PY'
          from dataclasses import FrozenInstanceError
          from pathlib import Path

          from artifact_auditor.m32_published_boundary_intake import (
              M32_PUBLISHED_DOCUMENT_IDENTITIES,
              M32_PUBLISHED_REGISTRY_REVISION,
              M32_PUBLISHED_TRANSCRIPT_IDENTITIES,
              M32_SOURCE_COMMIT,
              M32PublishedDocumentRole,
              validate_m32_published_boundary,
          )

          result = validate_m32_published_boundary(Path("../upstream"))
          if result.registry_revision != M32_PUBLISHED_REGISTRY_REVISION:
              raise SystemExit("M32 registry revision mismatch")
          if result.source_commit != M32_SOURCE_COMMIT:
              raise SystemExit("M32 source commit mismatch")
          if result.documents != tuple(
              result.document(identity.role)
              for identity in M32_PUBLISHED_DOCUMENT_IDENTITIES
          ):
              raise SystemExit("M32 document order or lookup mismatch")
          if tuple(document.identity.role for document in result.documents) != (
              M32PublishedDocumentRole.FORMAL_SCHEMA,
              M32PublishedDocumentRole.TRACE_BUNDLE,
              M32PublishedDocumentRole.MANIFEST,
              M32PublishedDocumentRole.QUALIFICATION,
          ):
              raise SystemExit("M32 document role inventory mismatch")
          if result.total_document_bytes != 458_096:
              raise SystemExit("M32 total published bytes mismatch")
          if len(result.source_identities) != 29:
              raise SystemExit("M32 source identity inventory mismatch")
          if result.total_source_bytes != 442_916:
              raise SystemExit("M32 total source identity bytes mismatch")
          if (
              result.transcript_identities
              != M32_PUBLISHED_TRANSCRIPT_IDENTITIES
          ):
              raise SystemExit("M32 transcript identity inventory mismatch")
          if result.total_transcript_bytes != 436_132:
              raise SystemExit("M32 total transcript identity bytes mismatch")
          if not all(
              source.source_artifact.verify_integrity()
              for source in result.source_identities
          ):
              raise SystemExit("M32 captured source integrity mismatch")
          if result.loaded_at.tzinfo is None:
              raise SystemExit("M32 intake timestamp must be timezone-aware")
          try:
              result.registry_revision = "tampered"
          except FrozenInstanceError:
              pass
          else:
              raise SystemExit("M32 validation result is not frozen")
          print("M32 immutable API qualification: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m24-tests.txt"

          grep -F "Ran 655 tests" \
            "$RUNNER_TEMP/frp-observatory-m24-tests.txt"
          grep -E '^OK( \(skipped=[0-9]+\))?$' \
            "$RUNNER_TEMP/frp-observatory-m24-tests.txt"

          git -C ../upstream diff --exit-code
          git -C ../upstream diff --cached --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? artifact_auditor/"
              "m32_published_boundary_intake.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-file publication boundary: PASS")
          PY

      - name: Commit and publish only the M32 intake source
        working-directory: observatory
        shell: bash
        env:
          MODULE_SOURCE_SHA256: e3c1ac33e9a9382e3979dd8a2aebb6569cc8726a8e46a9c11af4e15122bd3661
        run: |
          set -euo pipefail
          target="artifact_auditor/m32_published_boundary_intake.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(
              "artifact_auditor/m32_published_boundary_intake.py"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M32 intake source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["MODULE_SOURCE_SHA256"]:
              raise SystemExit(
                  f"M32 intake source digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M32 intake source is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M32 published boundary intake source"
          git push origin HEAD:main

      - name: Publish M24 summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## FRP Observatory M24 M32 Published Boundary Source"
            echo
            echo "| Boundary | Result |"
            echo "|---|---|"
            echo "| Trigger | manual main only |"
            echo "| M23 prerequisite | exact |"
            echo "| M32 publication documents | 4 exact files |"
            echo "| M32 source identities | 29 exact files |"
            echo "| M32 transcript identities | 4 exact records |"
            echo "| M32 scheduler traces | 2 |"
            echo "| M32 source ticks | 33 |"
            echo "| M32 structured trace records | 396 |"
            echo "| M32 active-zero cell observations | 238 |"
            echo "| Observatory regression | 655 tests |"
            echo "| FRP mutation | forbidden |"
            echo "| Published Observatory source files | 1 |"
            echo "| Job status | ${JOB_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
