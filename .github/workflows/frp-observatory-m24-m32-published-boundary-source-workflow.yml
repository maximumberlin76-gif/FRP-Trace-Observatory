name: FRP Observatory M24 M32 Published Boundary Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m24-m32-published-boundary-source-main
  cancel-in-progress: false

jobs:
  publish-m32-boundary-source:
    name: Install and qualify exact read-only M32 intake
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M23 and upstream prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/.github/workflows/"
                  "frp-observatory-m23-m32-published-boundary-"
                  "intake-workflow.yml"
              ): (
                  34_094,
                  "047b476fe3c411014898aac78a30456e"
                  "7f00e89299da5980e41ab16fe21b3529",
              ),
              Path(
                  "upstream/schemas/m32/"
                  "frp.m32.deterministic_rtl_trace_bundle.v1.schema.json"
              ): (
                  34_066,
                  "534db8227218184cac5d1cabb461dd63"
                  "b1b61a99e0269c98535539ad3f7d7da2",
              ),
              Path(
                  "upstream/artifacts/m32/exports/"
                  "m32-deterministic-rtl-trace-bundle.json"
              ): (
                  412_195,
                  "62d8c1e6d205b9262a5c950883d32592"
                  "75d5049f7a896ae12956a210cb75b7e0",
              ),
              Path(
                  "upstream/artifacts/m32/manifests/"
                  "m32-deterministic-rtl-trace-manifest.json"
              ): (
                  7_211,
                  "da011dbc726d6d1fc0b7dbae12afe1e1"
                  "3d8240df64b9474fd0130c94ba005859",
              ),
              Path(
                  "upstream/artifacts/m32/qualification/"
                  "m32-deterministic-rtl-trace-qualification.json"
              ): (
                  4_624,
                  "26ec2d3eadd73b490eb023572101bb78c"
                  "f5d11561ead91b78b1a30e690458273",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/artifact_auditor/"
              "m32_published_boundary_intake.py"
          )
          expected_target_sha256 = (
              "e3c1ac33e9a9382e3979dd8a2aebb656"
              "9cc8726a8e46a9c11af4e15122bd3661"
          )
          if target.is_symlink():
              raise SystemExit("M32 intake source target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit(
                      "M32 intake source target is not a regular file"
                  )
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "An unexpected M32 intake source already exists: "
                      f"{observed}"
                  )
              print("Exact M32 intake source is already present")
          else:
              print("M32 intake source target is ready")

          print("Exact M23 prerequisite: PASS")
          print("Exact FRP M32 publication boundary: PASS")
          PY

