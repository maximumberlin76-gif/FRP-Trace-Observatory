          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["MODULE_GZIP_BASE64"].split())
          expected_encoded_length = int(os.environ["MODULE_BASE64_LENGTH"])
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != expected_encoded_length:
              raise SystemExit(
                  "Module payload length mismatch: "
                  f"{len(encoded)} != {expected_encoded_length}"
              )
          if observed_encoded_sha256 != os.environ["MODULE_BASE64_SHA256"]:
              raise SystemExit(
                  "Module payload digest mismatch: "
                  f"{observed_encoded_sha256} != "
                  f'{os.environ["MODULE_BASE64_SHA256"]}'
              )

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["MODULE_GZIP_LENGTH"]):
              raise SystemExit("Compressed module length mismatch")
          if observed_compressed_sha256 != os.environ["MODULE_GZIP_SHA256"]:
              raise SystemExit("Compressed module digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["MODULE_SOURCE_LENGTH"]):
              raise SystemExit("Decoded module length mismatch")
          if source.count(b"\n") != int(os.environ["MODULE_SOURCE_LINES"]):
              raise SystemExit("Decoded module line-count mismatch")
          if observed_source_sha256 != os.environ["MODULE_SOURCE_SHA256"]:
              raise SystemExit("Decoded module digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded module terminal newline mismatch")

          parent = Path("artifact_auditor")
          target = parent / "m31_published_boundary_intake.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("artifact_auditor package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 intake source target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 intake source"
                  )
              print("Exact M31 intake source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 intake source")

          installed = target.read_bytes()
          if installed != source:
              raise SystemExit("Installed M31 intake source verification failed")
          print(f"module_bytes={len(installed)}")
          print(f"module_sha256={observed_source_sha256}")
          PY

      - name: Qualify complete read-only M31 source
        working-directory: observatory
        shell: bash
        env:
          UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m10-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            trace_explorer \
            transition_visualizer

          python -m artifact_auditor.m31_published_boundary_intake \
            --upstream-root "$UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m10-intake.txt"

          grep -Fx \
            "FRP Observatory M31 published boundary intake: PASS" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "published_document_bytes=43801" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "provenance_sources=12" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "m30_archive_members=10" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "balanced_ternary_notation=-1/0/1" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m10-intake.txt"

          python - <<'PY'
          from dataclasses import FrozenInstanceError
          from pathlib import Path

          from artifact_auditor.m31_published_boundary_intake import (
              M31_PUBLISHED_DOCUMENT_IDENTITIES,
              M31_PUBLISHED_REGISTRY_REVISION,
              M31PublishedDocumentRole,
              validate_m31_published_boundary,
          )

          result = validate_m31_published_boundary(Path("../upstream"))
          if result.registry_revision != M31_PUBLISHED_REGISTRY_REVISION:
              raise SystemExit("M31 registry revision mismatch")
          if result.documents != tuple(
              result.document(identity.role)
              for identity in M31_PUBLISHED_DOCUMENT_IDENTITIES
          ):
              raise SystemExit("M31 document order or lookup mismatch")
          if tuple(document.identity.role for document in result.documents) != (
              M31PublishedDocumentRole.FORMAL_SCHEMA,
              M31PublishedDocumentRole.EVIDENCE,
              M31PublishedDocumentRole.MANIFEST,
              M31PublishedDocumentRole.QUALIFICATION,
          ):
              raise SystemExit("M31 document role inventory mismatch")
          if result.total_document_bytes != 43_801:
              raise SystemExit("M31 total published bytes mismatch")
          if len(result.provenance_sources) != 12:
              raise SystemExit("M31 provenance source inventory mismatch")
          if result.m30_archive_member_count != 10:
              raise SystemExit("M30 archive member inventory mismatch")
          if result.loaded_at.tzinfo is None:
              raise SystemExit("M31 intake timestamp must be timezone-aware")
          try:
              result.registry_revision = "tampered"
          except FrozenInstanceError:
              pass
          else:
              raise SystemExit("M31 validation result is not frozen")
          print("M31 immutable API qualification: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m10-tests.txt"

          grep -F "Ran 447 tests" \
            "$RUNNER_TEMP/frp-observatory-m10-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m10-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? artifact_auditor/"
              "m31_published_boundary_intake.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-file publication boundary: PASS")
          PY

      - name: Commit and publish only the M31 intake source
        working-directory: observatory
        shell: bash
        env:
          MODULE_SOURCE_SHA256: f3cfcbc5c388065f8544b16c07bb988d269ec3745d141de215ff48b0e72e277c
        run: |
          set -euo pipefail
          target="artifact_auditor/m31_published_boundary_intake.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(
              "artifact_auditor/m31_published_boundary_intake.py"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 intake source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["MODULE_SOURCE_SHA256"]:
              raise SystemExit(
                  f"M31 intake source digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 intake source is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published boundary intake source"
          git push origin HEAD:main

      - name: Publish M10 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M10"
            echo
            echo "- Exact M31 published boundary source: PASS"
            echo "- Published M31 documents: 4"
            echo "- Current provenance sources: 12"
            echo "- M30 archive provenance members: 10"
            echo '- Balanced ternary notation: `-1/0/1`'
            echo "- Observatory regression: 447 tests PASS"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory source files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
