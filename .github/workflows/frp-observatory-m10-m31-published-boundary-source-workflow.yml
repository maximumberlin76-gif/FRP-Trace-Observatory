name: FRP Observatory M10 M31 Published Boundary Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m10-m31-published-boundary-source-main
  cancel-in-progress: false

jobs:
  publish-m31-boundary-source:
    name: Install and qualify exact read-only M31 intake
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M9 and upstream prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/.github/workflows/"
                  "frp-observatory-m9-m31-published-boundary-intake-workflow.yml"
              ): (
                  19_633,
                  "d7521520abb07f5d8a4f44c09f91d00f"
                  "a9c07b3a22356041116bbcd7f291672b",
              ),
              Path(
                  "upstream/schemas/m31/"
                  "frp.m31.phase_interference_active_zero_thermal_evidence."
                  "v1.schema.json"
              ): (
                  1_468,
                  "53d79d45d70753ccd24c3dc4c97af6f"
                  "ee481f86a9d7cdca7ef78b486c76479f7",
              ),
              Path(
                  "upstream/artifacts/m31/evidence/"
                  "m31-phase-interference-active-zero-thermal-evidence.json"
              ): (
                  39_993,
                  "bdaa676acbfb09d86d848070e8a2673c"
                  "5ce6902657a0b13b2e4293383bec8b42",
              ),
              Path(
                  "upstream/artifacts/m31/manifests/"
                  "m31-phase-interference-active-zero-thermal-evidence-"
                  "manifest.json"
              ): (
                  828,
                  "80f0841d0041cd22c2f76175b6139e60"
                  "1aede7b69823356ae1fefbce5f793e7c",
              ),
              Path(
                  "upstream/artifacts/m31/qualification/"
                  "m31-phase-interference-active-zero-thermal-evidence-"
                  "qualification.json"
              ): (
                  1_512,
                  "4c2446f954e01ec0aa37cc6c0fc70cf4"
                  "a87ec565c450628e31b0efcac9160224",
              ),
              Path(
                  "upstream/artifacts/m30/packages/"
                  "frp-v3.2.0-m30-archival-release.tar.gz"
              ): (
                  10_189_989,
                  "05ea33f6f3f505d315af930c2d51779f"
                  "7189905308473f32a57375e477069caa",
              ),
          }
          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          target = Path(
              "observatory/artifact_auditor/"
              "m31_published_boundary_intake.py"
          )
          expected_target_sha256 = (
              "f3cfcbc5c388065f8544b16c07bb988d"
              "269ec3745d141de215ff48b0e72e277c"
          )
          if target.is_symlink():
              raise SystemExit("M31 intake source target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit("M31 intake source target is not a regular file")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected_target_sha256:
                  raise SystemExit(
                      "An unexpected M31 intake source already exists: "
                      f"{observed}"
                  )
              print("Exact M31 intake source is already present")
          else:
              print("M31 intake source target is ready")

          print("Exact M9 prerequisite: PASS")
          print("Exact FRP M31 publication boundary: PASS")
          print("Exact FRP M30 archival boundary: PASS")
          PY

