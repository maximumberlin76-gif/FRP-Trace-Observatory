          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit(
                  "Transition Visualizer test payload length mismatch"
              )
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit(
                  "Transition Visualizer test payload digest mismatch"
              )

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit(
                  "Compressed visualizer test payload length mismatch"
              )
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit(
                  "Compressed visualizer test payload digest mismatch"
              )

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_LENGTH"]):
              raise SystemExit(
                  "Decoded Transition Visualizer tests length mismatch"
              )
          if source.count(b"\n") != int(os.environ["TEST_LINES"]):
              raise SystemExit(
                  "Decoded Transition Visualizer tests line-count mismatch"
              )
          if observed_source_sha256 != os.environ["TEST_SHA256"]:
              raise SystemExit(
                  "Decoded Transition Visualizer tests digest mismatch"
              )
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit(
                  "Decoded Transition Visualizer tests newline mismatch"
              )

          target = Path("tests/test_m31_published_transition_visualizer.py")
          if target.parent.is_symlink() or not target.parent.is_dir():
              raise SystemExit("Observatory tests boundary is invalid")
          if target.is_symlink():
              raise SystemExit(
                  "M31 Transition Visualizer test target is a symlink"
              )
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical visualizer tests"
                  )
              print("Exact M31 Transition Visualizer tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 Transition Visualizer tests")

          if target.read_bytes() != source:
              raise SystemExit(
                  "Installed Transition Visualizer test verification failed"
              )
          print(f"visualizer_test_bytes={len(source)}")
          print(f"visualizer_test_sha256={observed_source_sha256}")
          PY

      - name: Qualify exact M31 Transition Visualizer tests
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m21-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m unittest \
            tests.test_m31_published_transition_visualizer \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m21-targeted-tests.txt"

          grep -F "Ran 45 tests" \
            "$RUNNER_TEMP/frp-observatory-m21-targeted-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m21-targeted-tests.txt"

          python -m transition_visualizer.m31_published_transition_visualizer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m21-visualizer.txt"

          result="$RUNNER_TEMP/frp-observatory-m21-visualizer.txt"
          grep -Fx \
            "FRP Observatory M31 published Transition Visualizer: PASS" \
            "$result"
          grep -Fx "transition_frames=800" "$result"
          grep -Fx "active_zero_after_observations=702" "$result"
          grep -Fx \
            "classical_bit_addition_primary_mechanism=false" \
            "$result"
          grep -Fx "balanced_ternary_notation=-1/0/1" "$result"
          grep -Fx "active_neutral_state=0" "$result"
          grep -Fx "temporal_scheduler_modes=1/7,7/1" "$result"
          grep -Fx \
            'transition_classification_counts={"active_zero_to_polarity": 12, "direct_opposite": 0, "polarity_to_active_zero": 5, "retained_same": 783}' \
            "$result"
          grep -Fx \
            'route_leg_counts={"first_leg_to_active_zero": 5, "non_route_transition": 790, "pending_route_completion": 5}' \
            "$result"
          grep -Fx "thermal_contours=4" "$result"
          grep -Fx \
            "historical_and_current_contours_separate=true" \
            "$result"
          grep -Fx "physical_temperature_measurements=0" "$result"
          grep -Fx \
            "dataset_sha256=0ad87af2486798918a86a8a9fababdb45cb2b633c0f66e7c9b80b590ca8ed304" \
            "$result"
          grep -Fx \
            "visualizer_dataset_id=63a1feb9-1835-579e-ab00-eec4569e8ff3" \
            "$result"
          grep -Fx "source_execution=forbidden" "$result"
          grep -Fx "metric_normalization=forbidden" "$result"
          grep -Fx "thermal_contour_merging=forbidden" "$result"
          grep -Fx "semantic_reimplementation=forbidden" "$result"
          grep -Fx "source_mutation=forbidden" "$result"
          grep -Fx "downstream_writeback=forbidden" "$result"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m21-full-tests.txt"

          grep -F "Ran 629 tests" \
            "$RUNNER_TEMP/frp-observatory-m21-full-tests.txt"
          grep -E '^OK( \(skipped=[0-9]+\))?$' \
            "$RUNNER_TEMP/frp-observatory-m21-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? tests/"
              "test_m31_published_transition_visualizer.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 Transition Visualizer tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SHA256: f624116452dc765031ad06de9513046c99492c5689afe31d4b2954d87486969f
        run: |
          set -euo pipefail
          target="tests/test_m31_published_transition_visualizer.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(
              "tests/test_m31_published_transition_visualizer.py"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit(
                  "Exact M31 Transition Visualizer tests are missing"
              )
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SHA256"]:
              raise SystemExit(
                  f"M31 Transition Visualizer test digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 Transition Visualizer tests are already published."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Transition Visualizer tests"
          git push origin HEAD:main

      - name: Publish M21 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M21"
            echo
            echo "- Dedicated M31 Transition Visualizer tests: 45"
            echo "- Complete Observatory tests: 629"
            echo "- Exact source-linked transition frames: 800"
            echo "- Active-zero after-observations: 702"
            echo "- Direct opposite transitions: 0"
            echo "- Active-zero first route legs: 5"
            echo "- Pending route completions: 5"
            echo "- Balanced ternary domain: -1/0/1"
            echo "- Temporal scheduler modes: 1/7 and 7/1"
            echo "- Separate thermal evidence panels: 4"
            echo "- Physical temperature measurements: 0"
            echo "- Source execution: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Thermal contour merging: forbidden"
            echo "- Semantic reimplementation: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory test files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
