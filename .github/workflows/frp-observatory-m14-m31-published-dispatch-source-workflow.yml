          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["SOURCE_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["SOURCE_BASE64_LENGTH"]):
              raise SystemExit("Dispatch payload length mismatch")
          if observed_encoded_sha256 != os.environ["SOURCE_BASE64_SHA256"]:
              raise SystemExit("Dispatch payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["SOURCE_GZIP_LENGTH"]):
              raise SystemExit("Compressed dispatch length mismatch")
          if observed_compressed_sha256 != os.environ["SOURCE_GZIP_SHA256"]:
              raise SystemExit("Compressed dispatch digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["SOURCE_LENGTH"]):
              raise SystemExit("Decoded dispatch length mismatch")
          if source.count(b"\n") != int(os.environ["SOURCE_LINES"]):
              raise SystemExit("Decoded dispatch line-count mismatch")
          if observed_source_sha256 != os.environ["SOURCE_SHA256"]:
              raise SystemExit("Decoded dispatch digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Decoded dispatch terminal newline mismatch")

          parent = Path("parsers")
          target = parent / "m31_published_dispatch.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("parsers package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 dispatch target must not be a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 dispatch"
                  )
              print("Exact M31 dispatch source was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 dispatch source")

          if target.read_bytes() != source:
              raise SystemExit("Installed M31 dispatch verification failed")
          print(f"dispatch_bytes={len(source)}")
          print(f"dispatch_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 dispatch and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m14-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m parsers.m31_published_dispatch \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"

          grep -Fx \
            "FRP Observatory M31 published dispatch boundary: PASS" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "published_documents=4" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "dispatch_envelopes=6" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "artifact_auditor_dispatches=4" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "ternary_transition_visualizer_dispatches=1" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "trace_explorer_dispatches=1" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "legacy_schema_only_dispatch_reuse=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "mode_consumer_invocation=deferred" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "source_execution=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "metric_normalization=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "semantic_reimplementation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "source_mutation=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"
          grep -Fx "downstream_writeback=forbidden" \
            "$RUNNER_TEMP/frp-observatory-m14-dispatch.txt"

          python - <<'PY'
          from dataclasses import FrozenInstanceError, replace
          from pathlib import Path

          from artifact_auditor.m31_published_boundary_intake import (
              M31PublishedDocumentRole,
          )
          from parsers.m31_published_dispatch import (
              M31PublishedDispatchError,
              M31PublishedDocumentDispatch,
              build_m31_published_dispatch_batch,
              dispatch_m31_published_documents,
          )
          from schemas.m31_published_registry import M31PublishedModeRoute
          from schemas.registry import ObservatoryMode

          batch = dispatch_m31_published_documents(Path("../upstream"))
          expected = (
              (
                  M31PublishedDocumentRole.FORMAL_SCHEMA,
                  ObservatoryMode.ARTIFACT_AUDITOR,
                  "63617ee1b7861551691d98aee2399ab493954c1a120b180d86eae6d539bdbe15",
              ),
              (
                  M31PublishedDocumentRole.EVIDENCE,
                  ObservatoryMode.ARTIFACT_AUDITOR,
                  "649502c9cb9c27572ff6691fb111c33fbf3022048865a17a2fc85f9fc3d74aa0",
              ),
              (
                  M31PublishedDocumentRole.EVIDENCE,
                  ObservatoryMode.TERNARY_TRANSITION_VISUALIZER,
                  "ff4597411a781c814ab8ef009d30739857411d2a31ff34839d3060b478a697e8",
              ),
              (
                  M31PublishedDocumentRole.EVIDENCE,
                  ObservatoryMode.TRACE_EXPLORER,
                  "f34b867fabcaab51515ecca39f2eb7287f52aa218d3ac48596a1481326009630",
              ),
              (
                  M31PublishedDocumentRole.MANIFEST,
                  ObservatoryMode.ARTIFACT_AUDITOR,
                  "5d67da0bfe4506c048200b50124fa574be697affa01ccb0cc3d0e338ca2daea3",
              ),
              (
                  M31PublishedDocumentRole.QUALIFICATION,
                  ObservatoryMode.ARTIFACT_AUDITOR,
                  "cb2843b72922803846a2bbecc541e4206b5886b818569d638968abd447562836",
              ),
          )
          observed = tuple(
              (
                  dispatch.role,
                  dispatch.mode,
                  dispatch.dispatch_sha256,
              )
              for dispatch in batch.dispatches
          )
          if observed != expected:
              raise SystemExit("M31 dispatch inventory mismatch")
          if len(
              batch.dispatches_for_role(
                  M31PublishedDocumentRole.EVIDENCE
              )
          ) != 3:
              raise SystemExit("M31 evidence dispatch count mismatch")
          try:
              batch.dispatches_for_role("evidence")
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("M31 string role alias was accepted")
          try:
              batch.dispatches_for_mode("artifact_auditor")
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("M31 string mode alias was accepted")
          try:
              batch.dispatch_for(
                  M31PublishedDocumentRole.FORMAL_SCHEMA,
                  ObservatoryMode.TRACE_EXPLORER,
              )
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("M31 undeclared dispatch was accepted")
          first = batch.dispatches[0]
          reconstructed = M31PublishedModeRoute(
              first.route.registration,
              first.route.mode,
          )
          try:
              M31PublishedDocumentDispatch.create(
                  batch.registry_validation,
                  first.document,
                  reconstructed,
              )
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("Reconstructed M31 route was accepted")
          try:
              replace(first, dispatch_sha256="0" * 64)
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("Forged M31 dispatch digest was accepted")
          try:
              first.dispatch_sha256 = "0" * 64
          except FrozenInstanceError:
              pass
          else:
              raise SystemExit("M31 dispatch is not frozen")
          try:
              build_m31_published_dispatch_batch(None)
          except M31PublishedDispatchError:
              pass
          else:
              raise SystemExit("Non-registry M31 batch was accepted")
          print("M31 exact dispatch API qualification: PASS")
          PY

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m14-tests.txt"

          grep -F "Ran 489 tests" \
            "$RUNNER_TEMP/frp-observatory-m14-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m14-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? parsers/m31_published_dispatch.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-dispatch-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 dispatch
        working-directory: observatory
        shell: bash
        env:
          SOURCE_SHA256: 7140a132f929076f22d2c4868b6a068ea21c5593b9672bc45df6cb1e2b81c495
        run: |
          set -euo pipefail
          target="parsers/m31_published_dispatch.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("parsers/m31_published_dispatch.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 dispatch source is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["SOURCE_SHA256"]:
              raise SystemExit(f"M31 dispatch digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 dispatch is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published dispatch boundary"
          git push origin HEAD:main

      - name: Publish M14 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M14"
            echo
            echo "- Exact M31 published documents: 4"
            echo "- Exact M31 dispatch envelopes: 6"
            echo "- Artifact Auditor dispatches: 4"
            echo "- Ternary Transition Visualizer dispatches: 1"
            echo "- Trace Explorer dispatches: 1"
            echo "- Legacy schema-only dispatcher reuse: forbidden"
            echo "- Mode consumer invocation: deferred"
            echo "- Source execution: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Semantic reimplementation: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory dispatch files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
