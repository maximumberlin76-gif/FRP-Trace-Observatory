name: FRP Observatory M25 M32 Tests Payload Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m25-m32-tests-payload-repair-main
  cancel-in-progress: false

jobs:
  repair-m25-tests-payload:
    name: Repair exact M25 tests payload
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Repair and verify exact M25 payload
        shell: bash
        env:
          BROKEN_WORKFLOW_SHA256: 36c7c2d8e76710e8f688c9d3221f0f4d5a5e9d1f4b0b8a37cb267bc09da41f4a
          REPAIRED_WORKFLOW_SHA256: 51e83964fe6e015cb6cd45b0ce1a96e6d4c3bcb5f4ba336adbb004ac665810fa
          PAYLOAD_SHA256: 5f0efe79f38ff2b16d11e3d147a4faf160edbdbee283723366b9d0b51c47c975
          GZIP_SHA256: 092a9851ebf538daa2deda5e04bb08714ee7107de124d06a1b4b5ccb3ffe2ca4
          TEST_SHA256: d4e85d96caf20d472b50157368169b6224b8acab5e999c243d7907d31e0890d3
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          target = Path(
              ".github/workflows/"
              "frp-observatory-m25-m32-published-boundary-"
              "tests-workflow.yml"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M25 workflow is missing")

          raw = target.read_bytes()
          observed = hashlib.sha256(raw).hexdigest()
          if observed == os.environ["REPAIRED_WORKFLOW_SHA256"]:
              repaired = raw
              print("Exact M25 payload is already repaired")
          else:
              if observed != os.environ["BROKEN_WORKFLOW_SHA256"]:
                  raise SystemExit(
                      "Unexpected M25 workflow digest: "
                      f"{observed}"
                  )

              replacements = (
                  (
                      b"LD6giciasKkBtXEsGkOPdq47A9YkF6EkmAHyLfUi+gf/68gG",
                      b"LD6gciasKkBtXEsGkOPdq47A9YkF6EkmAHyLfUi+gf/68gG",
                  ),
                  (
                      b"Zvq6uixG//QdD3v13Cgo3DnOlFPPpb71c2E2CYlFu55nUc78",
                      b"Zvq6uixG//QdD3v13nCgo3DnOlFPPpb71c2E2CYlFu55nUc78",
                  ),
              )
              repaired = raw
              for broken, exact in replacements:
                  if repaired.count(broken) != 1:
                      raise SystemExit(
                          "Expected one exact broken payload fragment"
                      )
                  repaired = repaired.replace(broken, exact)

              repaired_sha256 = hashlib.sha256(repaired).hexdigest()
              if repaired_sha256 != os.environ["REPAIRED_WORKFLOW_SHA256"]:
                  raise SystemExit(
                      "Repaired M25 workflow digest mismatch: "
                      f"{repaired_sha256}"
                  )
              target.write_bytes(repaired)

          text = repaired.decode("utf-8")
          marker = "          TEST_GZIP_BASE64: |\n"
          if text.count(marker) != 1:
              raise SystemExit("M25 payload marker mismatch")
          payload_lines = []
          for line in text.split(marker, 1)[1].splitlines():
              if not line.startswith("            "):
                  break
              payload_lines.append(line[12:])
          encoded = "".join(payload_lines)
          if len(encoded) != 9_352:
              raise SystemExit("Repaired payload length mismatch")
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != os.environ[
              "PAYLOAD_SHA256"
          ]:
              raise SystemExit("Repaired payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != 7_012:
              raise SystemExit("Repaired compressed length mismatch")
          if hashlib.sha256(compressed).hexdigest() != os.environ[
              "GZIP_SHA256"
          ]:
              raise SystemExit("Repaired compressed digest mismatch")

          source = gzip.decompress(compressed)
          if len(source) != 34_961 or source.count(b"\n") != 914:
              raise SystemExit("Decoded M32 test identity mismatch")
          if hashlib.sha256(source).hexdigest() != os.environ["TEST_SHA256"]:
              raise SystemExit("Decoded M32 test digest mismatch")
          if target.read_bytes() != repaired:
              raise SystemExit("M25 workflow write verification failed")

          print("Exact M25 payload repair: PASS")
          print(f"workflow_sha256={hashlib.sha256(repaired).hexdigest()}")
          print(f"payload_sha256={hashlib.sha256(encoded.encode('ascii')).hexdigest()}")
          print(f"test_sha256={hashlib.sha256(source).hexdigest()}")
          PY

      - name: Commit and publish only the repaired M25 workflow
        shell: bash
        env:
          REPAIRED_WORKFLOW_SHA256: 51e83964fe6e015cb6cd45b0ce1a96e6d4c3bcb5f4ba336adbb004ac665810fa
        run: |
          set -euo pipefail
          target=".github/workflows/frp-observatory-m25-m32-published-boundary-tests-workflow.yml"

          observed="$(sha256sum "$target" | cut -d ' ' -f 1)"
          if [[ "$observed" != "$REPAIRED_WORKFLOW_SHA256" ]]; then
            echo "M25 workflow digest mismatch: $observed"
            exit 1
          fi

          status="$(git status --porcelain=v1 --untracked-files=all)"
          expected=" M $target"
          if [[ -n "$status" && "$status" != "$expected" ]]; then
            echo "Unexpected repository changes:"
            git status --short
            exit 1
          fi

          git add -- "$target"
          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M25 payload is already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair M25 M32 tests payload"
          git push origin HEAD:main

      - name: Publish repair summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M25 Payload Repair"
            echo
            echo "- Exact broken workflow identity: verified"
            echo "- Corrected payload fragments: 2"
            echo "- Repaired workflow identity: verified"
            echo "- Embedded payload identity: verified"
            echo "- Decoded M32 tests identity: verified"
            echo "- Published repaired files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
