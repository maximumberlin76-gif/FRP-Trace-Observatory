        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payloads = (
              (
                  "MODULE_GZIP_BASE64",
                  "MODULE_SHA256",
                  Path("parsers/m30_published_member_intake.py"),
              ),
              (
                  "TEST_GZIP_BASE64",
                  "TEST_SHA256",
                  Path("tests/test_m30_published_member_intake.py"),
              ),
          )
          for payload_name, digest_name, target in payloads:
              encoded = "".join(os.environ[payload_name].split())
              compressed = base64.b64decode(encoded, validate=True)
              source = gzip.decompress(compressed)
              expected = os.environ[digest_name]
              observed = hashlib.sha256(source).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Decoded {target} digest mismatch: "
                      f"{observed} != {expected}"
                  )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source)
              written = hashlib.sha256(target.read_bytes()).hexdigest()
              if written != expected:
                  raise SystemExit(
                      f"Written {target} digest mismatch: "
                      f"{written} != {expected}"
                  )
              print(f"Installed complete source: {target}")
              print(f"source_sha256={expected}")
          PY

      - name: Validate exact read-only intake and complete Observatory tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q artifact_auditor parsers schemas trace_explorer transition_visualizer tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake --archive "$archive"
          PYTHONPATH=. python -m schemas.m30_published_registry --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_member_intake --archive "$archive"

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          from parsers.m30_published_member_intake import (
              PublishedIdentifierBinding,
              intake_m30_published_members,
          )
          from schemas.m30_published_registry import (
              M30_PUBLISHED_MEMBER_REGISTRATIONS,
          )
          from schemas.registry import ObservatoryMode

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = intake_m30_published_members(archive)
          if len(result.members) != 4:
              raise SystemExit("M4 published member count mismatch")
          if result.total_byte_length != 18_097:
              raise SystemExit("M4 retained raw-byte total mismatch")
          if result.total_route_count != 7:
              raise SystemExit("M4 eligible route count mismatch")
          if tuple(
              member.registration for member in result.members
          ) != M30_PUBLISHED_MEMBER_REGISTRATIONS:
              raise SystemExit("M4 registration order mismatch")
          if tuple(
              member.identifier_binding for member in result.members
          ) != (
              PublishedIdentifierBinding.SCHEMA_FIELD,
              PublishedIdentifierBinding.ARTIFACT_ID_SCHEMA_VERSION_FIELDS,
              PublishedIdentifierBinding.SCHEMA_FIELD,
              PublishedIdentifierBinding.SCHEMA_FIELD,
          ):
              raise SystemExit("M4 identifier binding inventory mismatch")
          m27 = result.members[1]
          if tuple(
              (item.field_name, item.value)
              for item in m27.identifier_evidence
          ) != (
              ("artifact_id", "frp-m27-telemetry-semantics"),
              ("schema_version", "2.9.0"),
          ):
              raise SystemExit("M27 identifier evidence mismatch")
          for member in result.members:
              if member.raw_bytes != member.retained_member.raw_bytes:
                  raise SystemExit(
                      f"Raw-byte preservation failed: {member.member_id}"
                  )
              if sha256(member.raw_bytes).hexdigest() != (
                  member.registration.raw_sha256
              ):
                  raise SystemExit(
                      f"Raw-byte digest failed: {member.member_id}"
                  )
          expected_mode_counts = {
              ObservatoryMode.ARTIFACT_AUDITOR: 4,
              ObservatoryMode.TERNARY_TRANSITION_VISUALIZER: 2,
              ObservatoryMode.TRACE_EXPLORER: 1,
          }
          for mode, expected in expected_mode_counts.items():
              observed = len(result.members_for_mode(mode))
              if observed != expected:
                  raise SystemExit(
                      f"{mode.value} member count mismatch: "
                      f"{observed} != {expected}"
                  )
          print("Exact four-member raw-byte intake: PASS")
          print("Strict immutable JSON object intake: PASS")
          print("Exact schema/composite identifier binding: PASS")
          print("Exact 4/2/1 existing-mode eligibility: PASS")
          print("Source execution and semantic normalization: FORBIDDEN")
          print("Upstream mutation and downstream writeback: FORBIDDEN")
          PY

          FRP_M30_ARCHIVE_PATH="$archive" python -m unittest -v tests.test_m30_published_member_intake 2>&1 | tee m4-focused-tests.log
          grep -F "Ran 27 tests" m4-focused-tests.log
          grep -Fx "OK" m4-focused-tests.log
          rm -f m4-focused-tests.log

          FRP_M30_ARCHIVE_PATH="$archive" python -m unittest discover -s tests -v 2>&1 | tee m4-all-tests.log
          grep -F "Ran 331 tests" m4-all-tests.log
          grep -Fx "OK" m4-all-tests.log
          rm -f m4-all-tests.log

      - name: Commit the complete published member intake source and tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- parsers/m30_published_member_intake.py tests/test_m30_published_member_intake.py
          git add -- parsers/m30_published_member_intake.py tests/test_m30_published_member_intake.py

          if git diff --cached --quiet; then
            echo "The exact M30 published member intake source and tests are already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^(parsers/m30_published_member_intake.py|tests/test_m30_published_member_intake.py)$' ||
              true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M30 published member read-only intake" -m "Capture and strictly decode the four exact M30-published members from the verified archive while preserving raw bytes, registry identity, and mode eligibility without execution, normalization, or writeback."
          git push origin HEAD:main
