          if global_core["temporal_scheduler_modes"] != ("1/7", "7/1"):
              raise SystemExit("Immutable scheduler order changed")

          direction = contract["integration_direction"]

          if direction["direction"] != "upstream_to_downstream_only":
              raise SystemExit("Observatory integration direction changed")

          if direction["downstream_source_mutation"] != "forbidden":
              raise SystemExit("Downstream source mutation became allowed")

          if direction["downstream_writeback"] != "forbidden":
              raise SystemExit("Downstream writeback became allowed")

          repeated = explore_m30_published_archive(archive)

