          if tuple(
              (
                  record.scheduler.mode,
                  record.scheduler.state,
                  record.scheduler.ticks_before,
                  record.scheduler.ticks_after,
              )
              for record in result.records
          ) != (
              ("free", "free", 0, 1),
              ("free", "free", 1, 2),
