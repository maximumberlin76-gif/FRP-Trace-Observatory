          if result.observed_ternary_domain != (-1, 0, 1):
              raise SystemExit("Ternary domain is not exactly -1/0/1")

          first_leg = result.records[1].cells[0]
          completion = result.records[2].cells[0]

          if (
              first_leg.retained_state_before,
              first_leg.retained_state_after,
              first_leg.pending_route_after,
              first_leg.neutral_routed,
          ) != (1, 0, -1, True):
              raise SystemExit("Active-neutral first route leg changed")

          if (
              completion.retained_state_before,
              completion.pending_route_before,
              completion.retained_state_after,
              completion.pending_route_after,
          ) != (0, -1, -1, 0):
              raise SystemExit("Pending route completion changed")

          if any(
              (
                  cell.retained_state_before,
                  cell.retained_state_after,
              ) in ((-1, 1), (1, -1))
              for record in result.records
              for cell in record.cells
          ):
              raise SystemExit("M7B contains a direct opposite transition")

          if result.event_totals != (
              ("actual_direct_events", 0),
              ("neutral_routed_events", 1),
              ("prevented_direct_events", 1),
              ("queue_overflow_events", 0),
              ("requested_direct_events", 1),
              ("reserved_state_events", 0),
          ):
              raise SystemExit("Exact event totals changed")

          expected_invariants = (
              "state_domain_valid",
              "scheduler_counts_valid",
              "request_lane_order_valid",
              "pending_polarity_valid",
              "active_neutral_valid",
              "transition_capacity_valid",
              "state_update_valid",
              "no_actual_direct_events",
              "no_reserved_state",
              "no_queue_overflow",
          )

          if any(
              record.invariant_names != expected_invariants
              or not record.invariant_all_pass
              for record in result.records
          ):
              raise SystemExit("Invariant vector changed or failed")

          if any(
              (
                  record.capacity_limit,
                  record.accepted_changes,
                  record.capacity_remaining,
                  record.capacity_exhausted,
                  record.switch_load_numerator,
                  record.switch_load_denominator,
                  record.switch_load_q16,
              ) != (2, 1, 1, False, 1, 8, 8192)
