      - name: Validate exact M16 projection and complete Observatory regression
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake \
            --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake \
            --archive "$archive"
          PYTHONPATH=. python -m schemas.m30_published_registry \
            --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_member_intake \
            --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_dispatch \
            --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_auditor \
            --archive "$archive"
          PYTHONPATH=. python -m trace_explorer.m30_published_trace_explorer \
            --archive "$archive"

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from artifact_auditor.audit_report import ValidationStatus
          from schemas.m30_published_registry import (
              PublishedMeasurementContour,
          )
          from schemas.registry import ObservatoryMode
          from trace_explorer.m30_published_trace_explorer import (
              explore_m30_published_archive,
          )

          archive = (
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = explore_m30_published_archive(archive)

          if result.audit_batch.overall_status is not (
              ValidationStatus.RECOGNIZED_VALID
          ):
              raise SystemExit("M7B did not receive a green M6 audit batch")

          if result.audit_batch.batch_sha256 != (
              "aeb9c1d7390a3bc3d1d7ef35c5f3f110e195e9b7ac8d4a4f4636c47c0a99bd03"
          ):
              raise SystemExit("M6 audit batch identity changed")

          if (
              result.audit_batch.total_check_count,
              result.audit_batch.failed_check_count,
          ) != (69, 0):
              raise SystemExit("M6 69-check evidence changed")

          if result.member_id != "m16-fpga-preparation-execution-trace":
              raise SystemExit("M7B selected the wrong published member")

          registration = result.dispatch.member.registration

          if registration.schema_identifier != (
              "frp.m16.fpga_preparation_execution_trace.v2.1.0"
          ):
              raise SystemExit("M16 schema identifier changed")

          if registration.source_path != (
              "artifacts/m19/execution/"
              "m16-fpga-preparation-execution-trace.json"
          ):
              raise SystemExit("M16 source path changed")

          if registration.raw_sha256 != (
              "7d58b6741bdcadbfb9acb9049ed0e956305f49b9ad36946e719a4121b5caf22f"
          ):
              raise SystemExit("M16 raw source identity changed")

          if result.dispatch.dispatch_sha256 != (
              "55e9c53f55cc5507e33271bfcdd2a48c751fd710b9fe8f9df972fc1c308f69b2"
          ):
              raise SystemExit("M5 Trace Explorer dispatch identity changed")

          expected_dispatch = (
              result.audit_batch.dispatch_batch.dispatch_for(
                  "m16-fpga-preparation-execution-trace",
                  ObservatoryMode.TRACE_EXPLORER,
              )
          )

          if result.dispatch is not expected_dispatch:
              raise SystemExit("M7B reconstructed the M5 dispatch route")

          if result.dispatch.member is not result.audit_report.dispatch.member:
              raise SystemExit("M6 and M7B do not share the exact M4 member")

          if result.dispatch.source_artifact is not (
              result.audit_report.dispatch.source_artifact
          ):
              raise SystemExit("M6 and M7B do not share exact source bytes")

          trace_routes = (
              result.audit_batch.dispatch_batch.dispatches_for_mode(
                  ObservatoryMode.TRACE_EXPLORER
              )
          )

          if len(trace_routes) != 1 or trace_routes[0] is not result.dispatch:
              raise SystemExit("Trace Explorer route inventory changed")

          if result.measurement_contour is not (
              PublishedMeasurementContour.M16_FPGA_PREPARATION_EXECUTION
          ):
              raise SystemExit("M16 measurement contour changed or was aliased")

          if (
              result.record_count,
              result.cell_snapshot_count,
              result.request_count,
          ) != (4, 32, 8):
              raise SystemExit("M7B complete trace inventory changed")

          if result.source_record_digest != (
              "4b2e8aec64a0b3cb76d0819383ed66d306b8e50dc3feb7bb8c6c76486cd83d57"
          ):
              raise SystemExit("M16 source record digest changed")

          if result.dataset_sha256 != (
              "4e6e0a1cd13dccbf6c6ab45850aefcb09d212fe4883f2d56c2c190dbee42bafd"
          ):
              raise SystemExit("M7B deterministic dataset digest changed")

          if result.trace_dataset_id != (
              "4191b36e-9168-5fc7-a4b5-cbc3b480136f"
          ):
              raise SystemExit("M7B deterministic dataset identifier changed")

          expected_record_ledger = (
              (
                  "c9f48870-584d-5622-8e17-e4096322b9a9",
                  "c7d1c6a3422c7578e559a04b252fe55b8889243ebbfd130b0aed290020033287",
              ),
              (
                  "812912bc-951a-56cb-86c8-6f49d7c7c56d",
                  "a9abe9c939d1ccdd1abc884c55f6e398f5443c491124ebd6faa54c627bc696d6",
              ),
              (
                  "92a09ab0-fc1c-5d4c-b25d-09234776c3ed",
                  "941d6efaadc31981d1e74f41a78a90f2e990bcfa6966a8e0ba62971377260767",
              ),
              (
                  "e803d9d8-1714-581a-a9d2-ea012cd42bde",
                  "7cfcf363d8f2cd5730b99cddfd761c82e02812bb04f2b912fa913f804e54de99",
