name: FRP Observatory M25 M32 Published Boundary Tests

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m25-m32-published-boundary-tests-main
  cancel-in-progress: false

jobs:
  publish-m32-boundary-tests:
    name: Install and qualify exact M32 boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Observatory main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory
          fetch-depth: 0

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Verify exact M24 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              Path(
                  "observatory/.github/workflows/"
                  "frp-observatory-m24-m32-published-boundary-"
                  "source-workflow.yml"
              ): (
                  35_108,
                  "8748984785a1e4a6b8b59c6c14cb5357"
                  "8a775b88bc1352172ef601a0275a5357",
              ),
              Path(
                  "observatory/artifact_auditor/"
                  "m32_published_boundary_intake.py"
              ): (
                  50_970,
                  "e3c1ac33e9a9382e3979dd8a2aebb656"
                  "9cc8726a8e46a9c11af4e15122bd3661",
              ),
          }

          for target, (expected_bytes, expected_sha256) in requirements.items():
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact prerequisite is missing: {target}")
              raw = target.read_bytes()
              observed_sha256 = sha256(raw).hexdigest()
              if len(raw) != expected_bytes:
                  raise SystemExit(
                      f"Prerequisite byte-count mismatch for {target}: "
                      f"{len(raw)} != {expected_bytes}"
                  )
              if observed_sha256 != expected_sha256:
                  raise SystemExit(
                      f"Prerequisite digest mismatch for {target}: "
                      f"{observed_sha256} != {expected_sha256}"
                  )

          print("Exact M24 workflow prerequisite: PASS")
          print("Exact M32 intake source prerequisite: PASS")
          PY

      - name: Recover and install integrity-bound M32 tests
        working-directory: observatory
        shell: bash
        env:
          PAYLOAD_PROVENANCE_COMMIT: a981b715b07f09b8ac39ec7e642192eb9b9110be
          PAYLOAD_PROVENANCE_BYTES: "23409"
          PAYLOAD_PROVENANCE_SHA256: 36c7c2d8e76710e8f688c9d3221f0f4d5a5e9d1f4b0b8a37cb267bc09da41f4a
          CANONICAL_WORKFLOW_BYTES: "23409"
          CANONICAL_WORKFLOW_SHA256: 51e83964fe6e015cb6cd45b0ce1a96e6d4c3bcb5f4ba336adbb004ac665810fa
          TEST_BASE64_LENGTH: "9352"
          TEST_BASE64_LINES: "94"
          TEST_BASE64_SHA256: 5f0efe79f38ff2b16d11e3d147a4faf160edbdbee283723366b9d0b51c47c975
          TEST_GZIP_LENGTH: "7012"
          TEST_GZIP_SHA256: 092a9851ebf538daa2deda5e04bb08714ee7107de124d06a1b4b5ccb3ffe2ca4
          TEST_SOURCE_LENGTH: "34961"
          TEST_SOURCE_LINES: "914"
          TEST_SOURCE_SHA256: d4e85d96caf20d472b50157368169b6224b8acab5e999c243d7907d31e0890d3
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          workflow_path = (
              ".github/workflows/"
              "frp-observatory-m25-m32-published-boundary-"
              "tests-workflow.yml"
          )
          provenance_commit = os.environ["PAYLOAD_PROVENANCE_COMMIT"]

          resolved_commit = subprocess.run(
              ["git", "rev-parse", f"{provenance_commit}^{{commit}}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if resolved_commit != provenance_commit:
              raise SystemExit(
                  "Payload provenance commit identity mismatch: "
                  f"{resolved_commit}"
              )

          ancestor = subprocess.run(
              [
                  "git",
                  "merge-base",
                  "--is-ancestor",
                  provenance_commit,
                  "HEAD",
              ],
              check=False,
          )
          if ancestor.returncode != 0:
              raise SystemExit(
                  "Payload provenance commit is not an ancestor of HEAD"
              )

          provenance = subprocess.run(
              ["git", "show", f"{provenance_commit}:{workflow_path}"],
              check=True,
              capture_output=True,
          ).stdout
          provenance_sha256 = hashlib.sha256(provenance).hexdigest()
          if len(provenance) != int(os.environ["PAYLOAD_PROVENANCE_BYTES"]):
              raise SystemExit(
                  "Payload provenance byte-count mismatch: "
                  f"{len(provenance)}"
              )
          if provenance_sha256 != os.environ["PAYLOAD_PROVENANCE_SHA256"]:
              raise SystemExit(
                  "Payload provenance digest mismatch: "
                  f"{provenance_sha256}"
              )

          corrections = (
              (
                  b"LD6giciasKkBtXEsGkOPdq47A9YkF6EkmAHyLfUi+gf/68gG",
                  b"LD6gciasKkBtXEsGkOPdq47A9YkF6EkmAHyLfUi+gf/68gG",
              ),
              (
                  b"Zvq6uixG//QdD3v13Cgo3DnOlFPPpb71c2E2CYlFu55nUc78",
                  b"Zvq6uixG//QdD3v13nCgo3DnOlFPPpb71c2E2CYlFu55nUc78",
              ),
          )
          canonical_workflow = provenance
          for old, new in corrections:
              if canonical_workflow.count(old) != 1:
                  raise SystemExit(
                      "Payload provenance correction boundary mismatch"
                  )
              canonical_workflow = canonical_workflow.replace(old, new, 1)

          canonical_workflow_sha256 = hashlib.sha256(
              canonical_workflow
          ).hexdigest()
          if len(canonical_workflow) != int(
              os.environ["CANONICAL_WORKFLOW_BYTES"]
          ):
              raise SystemExit(
                  "Recovered canonical workflow byte-count mismatch: "
                  f"{len(canonical_workflow)}"
              )
          if canonical_workflow_sha256 != os.environ[
              "CANONICAL_WORKFLOW_SHA256"
          ]:
              raise SystemExit(
                  "Recovered canonical workflow digest mismatch: "
                  f"{canonical_workflow_sha256}"
              )

          marker = b"          TEST_GZIP_BASE64: |\n"
          if canonical_workflow.count(marker) != 1:
              raise SystemExit("Canonical payload marker mismatch")
          payload_lines = []
          for line in canonical_workflow.split(marker, 1)[1].splitlines():
              if not line.startswith(b"            "):
                  break
              payload_lines.append(line[12:])

          if len(payload_lines) != int(os.environ["TEST_BASE64_LINES"]):
              raise SystemExit(
                  "Test payload line-count mismatch: "
                  f"{len(payload_lines)}"
              )
          encoded = b"".join(payload_lines)
          encoded_sha256 = hashlib.sha256(encoded).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit(
                  f"Test payload length mismatch: {len(encoded)}"
              )
          if encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit(
                  f"Test payload digest mismatch: {encoded_sha256}"
              )

          compressed = base64.b64decode(encoded, validate=True)
          compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit(
                  f"Compressed test length mismatch: {len(compressed)}"
              )
          if compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit(
                  f"Compressed test digest mismatch: {compressed_sha256}"
              )

          source = gzip.decompress(compressed)
          source_sha256 = hashlib.sha256(source).hexdigest()
          source_lines = source.count(b"\n")
          if len(source) != int(os.environ["TEST_SOURCE_LENGTH"]):
              raise SystemExit(
                  f"Test source length mismatch: {len(source)}"
              )
          if source_lines != int(os.environ["TEST_SOURCE_LINES"]):
              raise SystemExit(
                  f"Test source line-count mismatch: {source_lines}"
              )
          if source_sha256 != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit(
                  f"Test source digest mismatch: {source_sha256}"
              )
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit("Test source terminal-newline mismatch")
          if b"\r" in source:
              raise SystemExit("Test source contains a carriage return")
          source.decode("utf-8")

          tests_directory = Path("tests")
          target = tests_directory / "test_m32_published_boundary_intake.py"
          temporary = tests_directory / ".test_m32_published_boundary_intake.tmp"
          if tests_directory.is_symlink() or not tests_directory.is_dir():
              raise SystemExit("Tests directory boundary mismatch")
          if target.is_symlink():
              raise SystemExit("M32 test target must not be a symlink")
          if target.exists():
              if not target.is_file():
                  raise SystemExit("M32 test target is not a regular file")
              observed = hashlib.sha256(target.read_bytes()).hexdigest()
              if observed != os.environ["TEST_SOURCE_SHA256"]:
                  raise SystemExit(
                      "An unexpected M32 test file already exists: "
                      f"{observed}"
                  )
              print("Exact M32 tests are already present")
          else:
              if temporary.exists() or temporary.is_symlink():
                  raise SystemExit("Temporary test path is not clean")
              temporary.write_bytes(source)
              temporary.replace(target)
              print("Exact M32 tests installed")

          print(f"Payload provenance SHA-256: {provenance_sha256}")
          print(f"Canonical workflow SHA-256: {canonical_workflow_sha256}")
          print(f"M32 test source SHA-256: {source_sha256}")
          PY

      - name: Qualify exact M32 tests and full Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M32_UPSTREAM_ROOT: ../upstream
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m25-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            tests \
            trace_explorer \
            transition_visualizer

          python -m unittest \
            tests.test_m32_published_boundary_intake \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m25-m32-tests.txt"

          grep -F "Ran 23 tests" \
            "$RUNNER_TEMP/frp-observatory-m25-m32-tests.txt"
          grep -Eq '^OK( \(skipped=[0-9]+\))?$' \
            "$RUNNER_TEMP/frp-observatory-m25-m32-tests.txt"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m25-full-tests.txt"

          grep -F "Ran 678 tests" \
            "$RUNNER_TEMP/frp-observatory-m25-full-tests.txt"
          grep -Eq '^OK( \(skipped=[0-9]+\))?$' \
            "$RUNNER_TEMP/frp-observatory-m25-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = (
              "?? tests/"
              "test_m32_published_boundary_intake.py"
          )
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M32 tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SOURCE_SHA256: d4e85d96caf20d472b50157368169b6224b8acab5e999c243d7907d31e0890d3
        run: |
          set -euo pipefail
          target="tests/test_m32_published_boundary_intake.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("tests/test_m32_published_boundary_intake.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M32 test file is missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SOURCE_SHA256"]:
              raise SystemExit(f"M32 test digest mismatch: {observed}")

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M32 tests are already published; no commit needed."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M32 published boundary intake tests"
          git push origin HEAD:main

      - name: Publish M25 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M25"
            echo
            echo "- Exact M24 prerequisites: PASS"
            echo "- Immutable payload provenance: PASS"
            echo "- Exact M32 boundary tests: 23 PASS"
            echo "- Complete Observatory regression: 678 PASS"
            echo "- One-byte document tamper rejection: PASS"
            echo "- One-byte source-identity tamper rejection: PASS"
            echo "- Historical workflow execution: forbidden"
            echo "- Upstream workflow execution: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published Observatory test files: 1"
          } >> "$GITHUB_STEP_SUMMARY"
