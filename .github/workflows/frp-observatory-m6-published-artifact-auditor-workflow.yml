        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          payloads = (
              (
                  "MODULE_GZIP_BASE64",
                  "MODULE_SHA256",
                  Path("artifact_auditor/m30_published_auditor.py"),
              ),
              (
                  "TEST_GZIP_BASE64",
                  "TEST_SHA256",
                  Path("tests/test_m30_published_auditor.py"),
              ),
          )
          for payload_name, digest_name, target in payloads:
              encoded = "".join(os.environ[payload_name].split())
              compressed = base64.b64decode(encoded, validate=True)
              source = gzip.decompress(compressed)
              expected = os.environ[digest_name]
              observed = hashlib.sha256(source).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Decoded {target} digest mismatch: "
                      f"{observed} != {expected}"
                  )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source)
              written = hashlib.sha256(target.read_bytes()).hexdigest()
              if written != expected:
                  raise SystemExit(
                      f"Written {target} digest mismatch: "
                      f"{written} != {expected}"
                  )
              print(f"Installed complete source: {target}")
              print(f"source_sha256={expected}")
          PY

      - name: Validate four exact reports and complete Observatory regression
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q artifact_auditor parsers schemas trace_explorer transition_visualizer tests

          PYTHONPATH=. python -m artifact_auditor.m30_archive_intake --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_boundary_intake --archive "$archive"
          PYTHONPATH=. python -m schemas.m30_published_registry --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_member_intake --archive "$archive"
          PYTHONPATH=. python -m parsers.m30_published_dispatch --archive "$archive"
          PYTHONPATH=. python -m artifact_auditor.m30_published_auditor --archive "$archive"

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from artifact_auditor.audit_report import (
              CheckOutcome,
              ValidationStatus,
          )
          from artifact_auditor.m30_published_auditor import (
              audit_m30_published_archive,
          )
          from parsers.artifact_dispatch import (
              RegistrationStatus,
              dispatch_artifact,
          )
          from schemas.m30_published_registry import (
              PublishedMeasurementContour,
          )
          from schemas.registry import ObservatoryMode

          archive = (
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = audit_m30_published_archive(archive)

          expected_members = (
              "m16-fpga-preparation-execution-trace",
              "m27-telemetry-semantics",
              "m28-trace-observatory-upstream-contract",
              "m28-hierarchical-scaling-contract",
          )
          expected_contours = (
              PublishedMeasurementContour.M16_FPGA_PREPARATION_EXECUTION,
              PublishedMeasurementContour.M27_LONG_RUN_TELEMETRY_SEMANTICS,
              PublishedMeasurementContour.M28_UPSTREAM_INTEGRATION_CONTRACT,
              PublishedMeasurementContour.M28_HIERARCHICAL_SCALING_QUALIFICATION,
          )
          expected_check_counts = (22, 16, 15, 16)
          expected_report_digests = (
              "6c46ca147eb9a6d3bc0483ca4d25283a219b1f7f06a690f35ca7491a34251a17",
              "fbcd34ad44de9c0c3e5501492f6f2f3a6dc7870fc318ad099485d506dde59bb4",
              "db014a90d9d760b02e73e32e40a46cd1ac1defb85236a832e12496717d7c5769",
              "002859852bb07ec653fecc5653ca4d36bfee8d3bf7944cabc6ac57bc60cdf565",
          )
          if tuple(report.member_id for report in result.reports) != expected_members:
              raise SystemExit("M6 report member inventory or order mismatch")
          if tuple(
              report.measurement_contour for report in result.reports
          ) != expected_contours:
              raise SystemExit("M6 published measurement contours changed")
          if tuple(len(report.checks) for report in result.reports) != (
              expected_check_counts
          ):
              raise SystemExit("M6 per-member check inventory changed")
          if tuple(
              report.report_sha256 for report in result.reports
          ) != expected_report_digests:
              raise SystemExit("M6 deterministic report digest ledger changed")
          if result.batch_sha256 != (
              "aeb9c1d7390a3bc3d1d7ef35c5f3f110e195e9b7ac8d4a4f4636c47c0a99bd03"
          ):
              raise SystemExit("M6 deterministic batch digest changed")
          if result.total_check_count != 69 or result.failed_check_count != 0:
              raise SystemExit("M6 exact 69-check qualification failed")
          if result.overall_status is not ValidationStatus.RECOGNIZED_VALID:
              raise SystemExit("M6 batch is not recognized_valid")

          auditor_dispatches = result.dispatch_batch.dispatches_for_mode(
              ObservatoryMode.ARTIFACT_AUDITOR
          )
          for report, dispatch in zip(
              result.reports,
              auditor_dispatches,
              strict=True,
          ):
              if report.dispatch is not dispatch:
                  raise SystemExit("M6 reconstructed an M5 dispatch")
              if report.dispatch.source_artifact is not (
                  dispatch.member.source_artifact
              ):
                  raise SystemExit("M6 reconstructed an M4 source")
              if report.dispatch.parsed_artifact is not (
                  dispatch.member.parsed_artifact
              ):
                  raise SystemExit("M6 reconstructed an M4 parsed object")
              if report.measurement_contour is not (
                  dispatch.member.registration.measurement_contour
              ):
                  raise SystemExit("M6 rebound a published contour")
              if report.passed_count != len(report.checks):
                  raise SystemExit("M6 report contains a failed check")
              if any(
                  check.outcome is not CheckOutcome.PASS
                  for check in report.checks
              ):
                  raise SystemExit("M6 report check is not PASS")
              if any(
                  location.package_member
                  != dispatch.member.registration.source_path
                  for check in report.checks
                  for location in check.source_locations
              ):
                  raise SystemExit("M6 check location left its source member")

          m27 = result.report_for_member("m27-telemetry-semantics")
          m27_root = m27.dispatch.parsed_artifact.root
          if m27_root["artifact_id"] != "frp-m27-telemetry-semantics":
              raise SystemExit("M27 artifact_id changed")
          if m27_root["schema_version"] != "2.9.0":
              raise SystemExit("M27 schema_version changed")
          if "schema" in m27_root:
              raise SystemExit("M27 received a synthetic schema alias")
          legacy = dispatch_artifact(m27.dispatch.source_artifact)
          if legacy.registration.status is not (
              RegistrationStatus.MISSING_IDENTIFIER
          ):
              raise SystemExit("M6 reused the legacy schema-only dispatcher")

          for member_id in (
              "m28-trace-observatory-upstream-contract",
              "m28-hierarchical-scaling-contract",
          ):
              core = result.report_for_member(
                  member_id
              ).dispatch.parsed_artifact.root["immutable_core"]
              if core["balanced_ternary_notation"] != "-1/0/1":
                  raise SystemExit("M6 balanced ternary notation changed")
              if core["semantic_values"] != (-1, 0, 1):
                  raise SystemExit("M6 ternary domain changed")
              if core["active_neutral_state"] != 0:
                  raise SystemExit("M6 active neutral state changed")
              if core["temporal_scheduler_modes"] != ("1/7", "7/1"):
                  raise SystemExit("M6 temporal scheduler order changed")

          direction = result.report_for_member(
              "m28-trace-observatory-upstream-contract"
          ).dispatch.parsed_artifact.root["integration_direction"]
          if direction["direction"] != "upstream_to_downstream_only":
              raise SystemExit("M6 integration direction changed")
          if direction["downstream_source_mutation"] != "forbidden":
              raise SystemExit("M6 downstream source mutation became allowed")
          if direction["downstream_writeback"] != "forbidden":
              raise SystemExit("M6 downstream writeback became allowed")

          repeated = audit_m30_published_archive(archive)
          if repeated.batch_sha256 != result.batch_sha256:
              raise SystemExit("M6 repeated audit digest changed")

          print("Four exact deterministic Artifact Auditor reports: PASS")
          print("Exact 69-check published qualification: PASS")
          print("Four distinct PublishedMeasurementContour values: RETAINED")
          print("Balanced ternary notation -1/0/1: RETAINED")
          print("Active neutral state 0: RETAINED")
          print("Temporal schedulers 1/7 and 7/1: RETAINED")
          print("M27 artifact_id plus schema_version identity: RETAINED")
          print("Producer-specific digest algorithms: VERIFIED")
          print("Legacy schema-only dispatch reuse: FORBIDDEN")
          print("Source execution and semantic normalization: FORBIDDEN")
          print("Upstream mutation and downstream writeback: FORBIDDEN")
          PY

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python -m unittest -v tests.test_m30_published_auditor 2>&1 | tee m6-focused-tests.log
          grep -F "Ran 26 tests" m6-focused-tests.log
          grep -Fx "OK" m6-focused-tests.log
          rm -f m6-focused-tests.log

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python -m unittest discover -s tests -v 2>&1 | tee m6-all-tests.log
          grep -F "Ran 377 tests" m6-all-tests.log
          grep -Fx "OK" m6-all-tests.log
          rm -f m6-all-tests.log

      - name: Commit the complete M30 published Artifact Auditor source and tests
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- artifact_auditor/m30_published_auditor.py tests/test_m30_published_auditor.py
          git add -- artifact_auditor/m30_published_auditor.py tests/test_m30_published_auditor.py

          if git diff --cached --quiet; then
            echo "The exact M30 published Artifact Auditor source and tests are already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^(artifact_auditor/m30_published_auditor.py|tests/test_m30_published_auditor.py)$' ||
              true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M30 published Artifact Auditor" -m "Create four deterministic read-only audit reports for the exact M30-published members while preserving distinct contours, producer-specific digest rules, the -1/0/1 and 1/7 plus 7/1 core invariants, the composite M27 identity, and the upstream-only no-writeback boundary."
          git push origin HEAD:main
