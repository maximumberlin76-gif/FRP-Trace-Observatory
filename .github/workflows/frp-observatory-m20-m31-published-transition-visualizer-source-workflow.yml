      - name: Commit and publish only the M31 Transition Visualizer
        working-directory: observatory
        shell: bash
        env:
          SOURCE_SHA256: 33de1cc15240dda0fc75cdb1feb8efa43e0d4e08026d98e8521939ae7162a96c
        run: |
          set -euo pipefail
          target="transition_visualizer/m31_published_transition_visualizer.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(
              "transition_visualizer/"
              "m31_published_transition_visualizer.py"
          )
          if target.is_symlink() or not target.is_file():
              raise SystemExit(
                  "Exact M31 Transition Visualizer source is missing"
              )
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["SOURCE_SHA256"]:
              raise SystemExit(
                  f"M31 Transition Visualizer digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 Transition Visualizer is already published."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Transition Visualizer"
          git push origin HEAD:main

