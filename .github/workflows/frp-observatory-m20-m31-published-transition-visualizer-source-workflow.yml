        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["SOURCE_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["SOURCE_BASE64_LENGTH"]):
              raise SystemExit("Transition Visualizer payload length mismatch")
          if observed_encoded_sha256 != os.environ["SOURCE_BASE64_SHA256"]:
              raise SystemExit("Transition Visualizer payload digest mismatch")

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["SOURCE_GZIP_LENGTH"]):
              raise SystemExit(
                  "Compressed Transition Visualizer length mismatch"
              )
          if observed_compressed_sha256 != os.environ["SOURCE_GZIP_SHA256"]:
              raise SystemExit(
                  "Compressed Transition Visualizer digest mismatch"
              )

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["SOURCE_LENGTH"]):
              raise SystemExit("Decoded Transition Visualizer length mismatch")
          if source.count(b"\n") != int(os.environ["SOURCE_LINES"]):
              raise SystemExit(
                  "Decoded Transition Visualizer line-count mismatch"
              )
          if observed_source_sha256 != os.environ["SOURCE_SHA256"]:
              raise SystemExit("Decoded Transition Visualizer digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit(
                  "Decoded Transition Visualizer terminal newline mismatch"
              )

          parent = Path("transition_visualizer")
          target = parent / "m31_published_transition_visualizer.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit(
                  "transition_visualizer package boundary is invalid"
              )
          if target.is_symlink():
              raise SystemExit(
                  "M31 Transition Visualizer target must not be a symlink"
              )
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace a non-identical M31 visualizer"
                  )
              print("Exact M31 Transition Visualizer was already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 Transition Visualizer source")

          if target.read_bytes() != source:
              raise SystemExit(
                  "Installed M31 Transition Visualizer verification failed"
              )
          print(f"transition_visualizer_bytes={len(source)}")
          print(f"transition_visualizer_sha256={observed_source_sha256}")
          PY

      - name: Qualify exact M31 Transition Visualizer
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m20-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m transition_visualizer.m31_published_transition_visualizer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
