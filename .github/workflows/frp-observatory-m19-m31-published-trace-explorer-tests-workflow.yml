        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          encoded = "".join(os.environ["TEST_GZIP_BASE64"].split())
          observed_encoded_sha256 = hashlib.sha256(
              encoded.encode("ascii")
          ).hexdigest()
          if len(encoded) != int(os.environ["TEST_BASE64_LENGTH"]):
              raise SystemExit(
                  "Trace Explorer test payload length mismatch: "
                  f"{len(encoded)}"
              )
          if observed_encoded_sha256 != os.environ["TEST_BASE64_SHA256"]:
              raise SystemExit(
                  "Trace Explorer test payload digest mismatch: "
                  f"{observed_encoded_sha256}"
              )

          compressed = base64.b64decode(encoded, validate=True)
          observed_compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != int(os.environ["TEST_GZIP_LENGTH"]):
              raise SystemExit("Compressed test payload length mismatch")
          if observed_compressed_sha256 != os.environ["TEST_GZIP_SHA256"]:
              raise SystemExit("Compressed test payload digest mismatch")

          source = gzip.decompress(compressed)
          observed_source_sha256 = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["TEST_LENGTH"]):
              raise SystemExit("Decoded Trace Explorer test length mismatch")
          if source.count(b"\n") != int(os.environ["TEST_LINES"]):
              raise SystemExit("Decoded Trace Explorer test line mismatch")
          if observed_source_sha256 != os.environ["TEST_SHA256"]:
              raise SystemExit("Decoded Trace Explorer test digest mismatch")
          if not source.endswith(b"\n") or source.endswith(b"\n\n"):
              raise SystemExit(
                  "Decoded Trace Explorer test terminal newline mismatch"
              )

          parent = Path("tests")
          target = parent / "test_m31_published_trace_explorer.py"
          if parent.is_symlink() or not parent.is_dir():
              raise SystemExit("tests package boundary is invalid")
          if target.is_symlink():
              raise SystemExit("M31 Trace Explorer test target is a symlink")
          if target.exists():
              if target.read_bytes() != source:
                  raise SystemExit(
                      "Refusing to replace non-identical Trace Explorer tests"
                  )
              print("Exact M31 Trace Explorer tests were already installed")
          else:
              target.write_bytes(source)
              print("Installed exact M31 Trace Explorer tests")

          if target.read_bytes() != source:
              raise SystemExit("Installed test verification failed")
          print(f"test_bytes={len(source)}")
          print(f"test_sha256={observed_source_sha256}")
          PY

      - name: Qualify M31 Trace Explorer tests and complete Observatory
        working-directory: observatory
        shell: bash
        env:
          FRP_M31_UPSTREAM_ROOT: ../upstream
          FRP_M30_ARCHIVE_PATH: ../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/frp-observatory-m19-pycache"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            tests \
            trace_explorer \
            transition_visualizer

          python -m unittest \
            tests.test_m31_published_trace_explorer \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m19-target-tests.txt"

          grep -F "Ran 41 tests" \
            "$RUNNER_TEMP/frp-observatory-m19-target-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m19-target-tests.txt"

          python -m trace_explorer.m31_published_trace_explorer \
            --upstream-root "$FRP_M31_UPSTREAM_ROOT" \
            | tee "$RUNNER_TEMP/frp-observatory-m19-trace-explorer.txt"

          result="$RUNNER_TEMP/frp-observatory-m19-trace-explorer.txt"
          grep -Fx \
            "FRP Observatory M31 published Trace Explorer: PASS" \
            "$result"
          grep -Fx "trace_contours=2" "$result"
          grep -Fx "records=100" "$result"
          grep -Fx "cell_snapshots=800" "$result"
          grep -Fx "requests=200" "$result"
          grep -Fx "invariant_pass_records=100" "$result"
          grep -Fx "active_zero_after_observations=702" "$result"
          grep -Fx "observed_scheduler_modes=free,7/1,1/7" "$result"
          grep -Fx "observed_ternary_domain=-1/0/1" "$result"
          grep -Fx \
            "dataset_sha256=ef5a040c9d30d02f90003e007e447cf0d66238f31ed27e3be92bdce31ad19fff" \
            "$result"
          grep -Fx "source_execution=forbidden" "$result"
          grep -Fx "metric_normalization=forbidden" "$result"
          grep -Fx "thermal_contour_merging=forbidden" "$result"
          grep -Fx "semantic_reimplementation=forbidden" "$result"
          grep -Fx "source_mutation=forbidden" "$result"
          grep -Fx "downstream_writeback=forbidden" "$result"

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v 2>&1 \
            | tee "$RUNNER_TEMP/frp-observatory-m19-full-tests.txt"

          grep -F "Ran 584 tests" \
            "$RUNNER_TEMP/frp-observatory-m19-full-tests.txt"
          grep -Fx "OK" \
            "$RUNNER_TEMP/frp-observatory-m19-full-tests.txt"

          git -C ../upstream diff --exit-code
          if [[ -n "$(git -C ../upstream status --porcelain)" ]]; then
            echo "The read-only FRP checkout was modified."
            git -C ../upstream status --short
            exit 1
          fi

          python - <<'PY'
          import subprocess

          expected = "?? tests/test_m31_published_trace_explorer.py"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected]):
              raise SystemExit(
                  "Unexpected Observatory changes before publication: "
                  f"{status!r}"
              )
          print("Read-only upstream and one-test-file boundary: PASS")
          PY

      - name: Commit and publish only the M31 Trace Explorer tests
        working-directory: observatory
        shell: bash
        env:
          TEST_SHA256: a176d49f4ccd10188fb096ab6e528316e0d98c956382a84fa2accbc869dd8cb5
        run: |
          set -euo pipefail
          target="tests/test_m31_published_trace_explorer.py"

          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path("tests/test_m31_published_trace_explorer.py")
          if target.is_symlink() or not target.is_file():
              raise SystemExit("Exact M31 Trace Explorer tests are missing")
          observed = hashlib.sha256(target.read_bytes()).hexdigest()
          if observed != os.environ["TEST_SHA256"]:
              raise SystemExit(
                  f"M31 Trace Explorer test digest mismatch: {observed}"
              )

          expected_untracked = f"?? {target.as_posix()}"
          status = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if status not in ([], [expected_untracked]):
              raise SystemExit(
                  "Refusing publication with unrelated changes: "
                  f"{status!r}"
              )
          PY

          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "Exact M31 Trace Explorer tests are already published."
            exit 0
          fi
          if [[ "$staged" != "$target" ]]; then
            echo "Unexpected staged publication boundary:"
            git diff --cached --name-only
            exit 1
          fi
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "Unexpected unstaged tracked changes:"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add M31 published Trace Explorer tests"
          git push origin HEAD:main

      - name: Publish M19 summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FRP Observatory M19"
            echo
            echo "- Dedicated M31 Trace Explorer tests: 41"
            echo "- Complete Observatory tests: 584"
            echo "- Preserved trace contours: 2"
            echo "- Exact execution records: 100"
            echo "- Exact cell snapshots: 800"
            echo "- Exact request-lane records: 200"
            echo "- Active-zero after-observations: 702"
            echo "- Balanced ternary domain: -1/0/1"
            echo "- Scheduler modes: free, 7/1, 1/7"
            echo "- Source execution: forbidden"
            echo "- Metric normalization: forbidden"
            echo "- Thermal contour merging: forbidden"
            echo "- Semantic reimplementation: forbidden"
            echo "- FRP source mutation: forbidden"
            echo "- Downstream writeback: forbidden"
            echo "- Published test files: 1"
