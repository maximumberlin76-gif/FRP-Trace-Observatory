          print(f"source_sha256={expected}")
          PY

      - name: Validate the exact full-core Transition Visualizer source
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          archive="../upstream/artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz"

          python -m compileall -q \
            artifact_auditor \
            parsers \
            schemas \
            trace_explorer \
            transition_visualizer \
            tests

          PYTHONPATH=. python \
            -m transition_visualizer.m30_published_transition_visualizer \
            --archive "$archive" \
            2>&1 | tee m8a-source.log

          grep -Fx \
            "FRP Observatory M8 full-core Transition Visualizer: PASS" \
            m8a-source.log
          grep -Fx "trace_sources=2" m8a-source.log
          grep -Fx "trace_records=100" m8a-source.log
          grep -Fx "transition_frames=800" m8a-source.log
          grep -Fx "telemetry_semantics=6" m8a-source.log
          grep -Fx "balanced_ternary_notation=-1/0/1" m8a-source.log
          grep -Fx "active_neutral_state=0" m8a-source.log
          grep -Fx "temporal_scheduler_modes=1/7,7/1" m8a-source.log
          grep -Fx "observed_scheduler_modes=free,7/1,1/7" m8a-source.log
          grep -Fx \
            "scheduler_mode_record_counts=(('free', 19), ('1/7', 17), ('7/1', 64))" \
            m8a-source.log
          grep -Fx \
            "scheduler_state_record_counts=(('free', 19), ('balance', 56), ('commit', 8), ('excite', 3), ('neutralize', 14))" \
            m8a-source.log
          grep -Fx "observed_ternary_domain=-1/0/1" m8a-source.log
          grep -Fx \
            "transition_classification_counts=(('same_state_retention', 783), ('polarity_to_neutral_transition', 5), ('neutral_to_polarity_transition', 12))" \
            m8a-source.log
          grep -Fx \
            "route_leg_counts=(('non_route_transition', 790), ('first_leg_neutralization', 5), ('pending_route_completion', 5))" \
            m8a-source.log
          grep -Fx \
            "dataset_sha256=7325fb188fd7709f28dda06765decaa29ac942895e4772b747291aec29ad3f2b" \
            m8a-source.log
          grep -Fx \
            "visualizer_dataset_id=68de3476-2e03-5506-93ea-062c3744e90d" \
            m8a-source.log
          rm m8a-source.log

          FRP_M30_ARCHIVE_PATH="$archive" PYTHONPATH=. python - <<'PY'
          from artifact_auditor.audit_report import ValidationStatus
          from transition_visualizer.m30_published_transition_visualizer import (
              visualize_m30_published_archive,
          )

          archive = (
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          result = visualize_m30_published_archive(archive)

          if result.audit_batch.overall_status is not (
              ValidationStatus.RECOGNIZED_VALID
          ):
              raise SystemExit("M8A did not receive a green M6 audit batch")
          if result.audit_batch.batch_sha256 != (
              "aeb9c1d7390a3bc3d1d7ef35c5f3f110e195e9b7ac8d4a4f4636c47c0a99bd03"
          ):
              raise SystemExit("M6 audit batch identity changed")
          if (
              result.audit_batch.total_check_count,
              result.audit_batch.failed_check_count,
          ) != (69, 0):
              raise SystemExit("M6 audit evidence changed")

          evidence = result.full_core_evidence
          if evidence.evidence_sha256 != (
              "b481d787fdef17992ed3236b4a7b1b142634b944ebb0048f4b77d3def089edd2"
          ):
              raise SystemExit("Full-core evidence digest changed")
          if evidence.evidence_id != (
              "7c935011-c734-5f6b-b312-dc476ad99724"
          ):
              raise SystemExit("Full-core evidence identifier changed")

          expected_sources = (
              (
                  "m16-rtl-execution",
                  "4a80e8e1-55cf-5010-b9ed-d3fa559f1549",
                  "m16_rtl_execution",
                  "d7945e0d2b5aaa05c5fff2e4e60d3b984017f7e4ae1984c55920368a110020bd",
                  96,
                  768,
              ),
              (
                  "m16-fpga-preparation-execution",
                  "166d7316-cd41-5289-b70a-e3af5ec37415",
                  "m16_fpga_preparation_execution",
                  "7d58b6741bdcadbfb9acb9049ed0e956305f49b9ad36946e719a4121b5caf22f",
                  4,
                  32,
              ),
          )
          observed_sources = tuple(
              (
                  source.dataset_id,
                  source.trace_source_id,
                  source.measurement_contour,
                  source.raw_sha256,
                  len(source.records),
                  sum(len(record.cells) for record in source.records),
              )
              for source in evidence.trace_sources
          )
          if observed_sources != expected_sources:
              raise SystemExit("Separate M16 trace contours changed")

          if result.trace_dataset.dataset_sha256 != (
              "4e6e0a1cd13dccbf6c6ab45850aefcb09d212fe4883f2d56c2c190dbee42bafd"
          ):
              raise SystemExit("M7 Trace Explorer dataset identity changed")
          if result.trace_dataset.trace_dataset_id != (
              "4191b36e-9168-5fc7-a4b5-cbc3b480136f"
          ):
              raise SystemExit("M7 Trace Explorer identifier changed")
          if result.m16_dispatch.dispatch_sha256 != (
              "204c63f20db49a7d946b0963058db148fe43bb715c353c74ac4f6b203e4e792f"
          ):
              raise SystemExit("M5 M16 visualizer route changed")
          if result.m27_dispatch.dispatch_sha256 != (
              "b17c84a8adc66205f75d8ae81053b181ba585647e8a5e29764f0d6ec062d4d21"
          ):
              raise SystemExit("M5 M27 visualizer route changed")

          if result.canonical_temporal_scheduler_modes != ("1/7", "7/1"):
              raise SystemExit("Immutable scheduler order changed")
          if result.observed_scheduler_modes != ("free", "7/1", "1/7"):
              raise SystemExit("Full-core observed scheduler modes changed")
          if result.observed_ternary_domain != (-1, 0, 1):
              raise SystemExit("Ternary domain is not exactly -1/0/1")
          if result.scheduler_mode_record_counts != (
              ("free", 19),
              ("1/7", 17),
              ("7/1", 64),
          ):
              raise SystemExit("Full-core scheduler mode counts changed")
          if result.scheduler_state_record_counts != (
              ("free", 19),
              ("balance", 56),
              ("commit", 8),
              ("excite", 3),
              ("neutralize", 14),
          ):
              raise SystemExit("Full-core scheduler state counts changed")
          if result.transition_classification_counts != (
              ("same_state_retention", 783),
              ("polarity_to_neutral_transition", 5),
              ("neutral_to_polarity_transition", 12),
          ):
              raise SystemExit("Transition classification counts changed")
          if result.route_leg_counts != (
              ("non_route_transition", 790),
              ("first_leg_neutralization", 5),
              ("pending_route_completion", 5),
          ):
              raise SystemExit("Active-neutral route counts changed")

          if result.trace_record_count != 100:
              raise SystemExit("Full-core trace record count changed")
          if len(result.transition_frames) != 800:
              raise SystemExit("Transition frame inventory changed")
          if len(result.telemetry_semantics) != 6:
              raise SystemExit("M27 telemetry semantic inventory changed")
          if any(
              (frame.retained_state_before, frame.retained_state_after)
              in ((-1, 1), (1, -1))
              for frame in result.transition_frames
          ):
              raise SystemExit("Direct opposite transition entered M8")

          if result.dataset_sha256 != (
              "7325fb188fd7709f28dda06765decaa29ac942895e4772b747291aec29ad3f2b"
          ):
              raise SystemExit("M8 deterministic dataset digest changed")
          if result.visualizer_dataset_id != (
              "68de3476-2e03-5506-93ea-062c3744e90d"
          ):
              raise SystemExit("M8 deterministic dataset identifier changed")

          repeated = visualize_m30_published_archive(archive)
          if repeated.dataset_sha256 != result.dataset_sha256:
              raise SystemExit("Repeated M8 projection digest changed")
          if repeated.visualizer_dataset_id != result.visualizer_dataset_id:
              raise SystemExit("Repeated M8 projection identifier changed")

          print("Exact RTL and FPGA M16 trace contours: RETAINED")
          print("Complete balanced ternary kernel -1/0/1: RETAINED")
          print("Active neutral state 0 and neutral routing: RETAINED")
          print("Temporal scheduler modes 1/7 and 7/1: RETAINED")
          print("M7 Trace Explorer cross-link: VERIFIED")
          print("M27 telemetry semantics: RETAINED")
          print("Upstream source execution, mutation, and writeback: FORBIDDEN")
          PY

          FRP_M30_ARCHIVE_PATH="$archive" \
            PYTHONPATH=. \
            python -m unittest discover -s tests -v \
            2>&1 | tee m8a-regression.log

          grep -F "Ran 406 tests" m8a-regression.log
          grep -Fx "OK" m8a-regression.log
          rm m8a-regression.log

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "../upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          expected = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )
          observed = sha256(archive.read_bytes()).hexdigest()

          if observed != expected:
              raise SystemExit("Upstream archive changed during M8A validation")

          print("Read-only upstream archive after M8A: VERIFIED")
          PY

      - name: Commit the complete M30 full-core Transition Visualizer source
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail

          target="transition_visualizer/m30_published_transition_visualizer.py"

          git diff --check -- "$target"
          git add -- "$target"

          if git diff --cached --quiet; then
            echo "The exact M30 full-core Transition Visualizer source is already current."
            exit 0
          fi

          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^transition_visualizer/m30_published_transition_visualizer.py$' ||
              true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

