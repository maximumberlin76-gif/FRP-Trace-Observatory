name: FRP Observatory M8A Full Core Transition Visualizer Source Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-observatory-m8a-full-core-transition-visualizer-source-main
  cancel-in-progress: false

jobs:
  bootstrap-full-core-transition-visualizer-source:
    name: Bootstrap the exact M16 full-core Transition Visualizer source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Observatory main
        uses: actions/checkout@v4
        with:
          ref: main
          path: observatory

      - name: Check out FRP upstream main read-only
        uses: actions/checkout@v4
        with:
          repository: maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow must be started manually."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow manually from Branch: main."
            exit 1
          fi

      - name: Require exact green M1 through M7 dependencies
        working-directory: observatory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          requirements = {
              "artifact_auditor/m30_archive_intake.py":
                  "d1101f5baf74fdcea4d08a14e7b21e1a6657ca19eb29d8387aba15f3ac5d904d",
              "artifact_auditor/m30_published_boundary_intake.py":
                  "4b1f580596425b15dd4548c30336db45a14b7aad4285feeb7cb490edc20b4b42",
              "schemas/m30_published_registry.py":
                  "d2769b3444a836e17e41a47fd34ca9c792d0897cb68e345ed4f622ff72ec8ab0",
              "tests/test_m30_published_registry.py":
                  "310f5e50a06d3e36603d49114741f6f87622d2b9f419773aabe1b2c9facadb99",
              "parsers/m30_published_member_intake.py":
                  "827af9233facfee466606163589c0b068d107b05e6bb8cbff4245409a09c367a",
              "tests/test_m30_published_member_intake.py":
                  "873bfa4c0d163b6a1b0df09873cdec6ecb39f12d496f49a76ec98bc5cda02c9e",
              "parsers/m30_published_dispatch.py":
                  "ba65c7cc1ad6d483dc1bbb09c729a165074280581f988f5a272c5e1289a33d50",
              "tests/test_m30_published_dispatch.py":
                  "a2ac6b0b5c6112756d0bec193b51e60926d07c45ce8ca6450110623db643ad64",
              "artifact_auditor/m30_published_auditor.py":
                  "3964ffaf2c0c51ba15a637ee3c18897de966d4b32e7931aabdd0d52c97c7de59",
              "tests/test_m30_published_auditor.py":
                  "18c3e4716337bba35000a4c44aab2f334d9cb4af98365517f712ddadaa26130a",
              "parsers/source_artifact.py":
                  "dad32b37e8a14213d91c9bfb407129ebb077432a8a366ad6ddb9a78bc9a0d59e",
              "parsers/json_artifact.py":
                  "3164a5704404f6ef7a16cfd6954ec14c9b1c1c757da3e7584eb500798e071efb",
              "schemas/registry.py":
                  "4d17a350bccd27edaafe1736a70ee153da426556355ce113416dbe6b596a43f2",
              "parsers/artifact_dispatch.py":
                  "abc765e34efd27a532b1fca0c91fc1982dbadd0a6d3d34b619e31225895cf050",
              "artifact_auditor/audit_report.py":
                  "94c665e47257c8ed3b2df03844791fd0bdc415aad3791a8eea155114492ddfc2",
              "trace_explorer/m30_published_trace_explorer.py":
                  "986335318fac7dbc894ab18133645653e712944e2997aaaf484e1c7a46f1c879",
              "tests/test_m30_published_trace_explorer.py":
                  "a9f37c8a13652dcd1aaa0beb68ac44e9b118af6f38e893ac4dce08031c77a24e",
          }

          for path_value, expected in requirements.items():
              target = Path(path_value)
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Required exact dependency is missing: {target}")
              observed = sha256(target.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"Dependency mismatch for {target}: "
                      f"{observed} != {expected}"
                  )
              print(f"Exact dependency: {target}: PASS")
          PY

      - name: Verify the exact green upstream full-core boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          archive = Path(
              "upstream/artifacts/m30/packages/"
              "frp-v3.2.0-m30-archival-release.tar.gz"
          )
          workflow = Path(
              "upstream/.github/workflows/"
              "frp-m30-observatory-full-core-trace-"
              "qualification-workflow.yml"
          )

          expected_archive_length = 10_189_989
          expected_archive_sha256 = (
              "05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa"
          )
          expected_workflow_sha256 = (
              "01ca22bc98f63d9d4ea4a58299d53ff58b410f3f2db94b81097d7cef3ad4dee7"
          )

          for target, label in (
              (archive, "M30 archival release"),
              (workflow, "M30 full-core qualification workflow"),
          ):
              if target.is_symlink() or not target.is_file():
                  raise SystemExit(f"Exact {label} is missing: {target}")

          archive_raw = archive.read_bytes()
          observed_archive_sha256 = sha256(archive_raw).hexdigest()
          observed_workflow_sha256 = sha256(workflow.read_bytes()).hexdigest()

          if len(archive_raw) != expected_archive_length:
              raise SystemExit(
                  "M30 package length mismatch: "
                  f"{len(archive_raw)} != {expected_archive_length}"
              )
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M30 package digest mismatch: "
                  f"{observed_archive_sha256} != "
                  f"{expected_archive_sha256}"
              )
          if observed_workflow_sha256 != expected_workflow_sha256:
              raise SystemExit(
                  "Full-core workflow digest mismatch: "
                  f"{observed_workflow_sha256} != "
                  f"{expected_workflow_sha256}"
              )

          print("Exact FRP v3.2.0 / M30 package identity: PASS")
          print("Exact green full-core qualification boundary: PASS")
          PY

